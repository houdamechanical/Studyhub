<script>
/* ===================== INHALT ===================== */
const PAGES={};

/* ======================= CHRISTLICHER TEIL ======================= */
PAGES.c={title:"Christlicher Teil",intro:"Hier geht es um die große Frage: <b>Was ist Religion überhaupt?</b> Du lernst, woher das Wort kommt, wie man Religion definieren kann, was Tillich und Kaufmann sagen und wie sich das christliche und das islamische Glaubensbekenntnis unterscheiden.",
chapters:[

{t:"Was ist Religion?",h:`
<p>Fast jeder Mensch hat ein Bild im Kopf, wenn er „Religion“ hört: eine Kirche, eine Moschee, ein Gebet, ein heiliges Buch. Aber was steckt dahinter? In diesem Kapitel bekommst du einen <b>Überblick</b>. Die folgenden Kapitel gehen dann einzeln in die Tiefe.</p>

<h3 class="sub">Eine einfache Arbeitsdefinition</h3>
<div class="box"><p>Religion ist die <b>Beziehung des Menschen zu etwas, das größer ist als er selbst</b>: zu Gott, dem Göttlichen, dem Heiligen oder dem Unendlichen. Diese Beziehung zeigt sich in dem, was Menschen <b>glauben</b>, wie sie <b>handeln</b> und wie sie <b>zusammenleben</b>.</p></div>
<p class="note">Achtung: Das ist nur eine Hilfe zum Verstehen. Eine Definition, der alle Wissenschaftler zustimmen, gibt es nicht (dazu mehr im nächsten Kapitel).</p>

<h3 class="sub">Woran erkennt man eine Religion?</h3>
<p>Auch wenn Religionen sehr verschieden sind, haben die meisten diese <b>Bausteine</b>:</p>
<div class="box"><h3>1. Glaubenslehre</h3><p>Was glaubt man? Aussagen über Gott, die Welt, den Menschen und das Leben nach dem Tod.<br><b>Beispiele:</b> das christliche Glaubensbekenntnis, das islamische Āmantu.</p></div>
<div class="box"><h3>2. Rituale</h3><p>Feste Handlungen, die immer wieder gleich ausgeführt werden.<br><b>Beispiele:</b> Gottesdienst, Taufe, Abendmahl; tägliches Gebet, Fasten im Ramadan.</p></div>
<div class="box"><h3>3. Ethik (Moral)</h3><p>Regeln, wie man richtig lebt und mit anderen umgeht.<br><b>Beispiele:</b> die Zehn Gebote, das Gebot der Nächstenliebe; Glaube und rechtschaffenes Handeln im Islam.</p></div>
<div class="box"><h3>4. Gemeinschaft</h3><p>Menschen, die denselben Glauben teilen und sich treffen.<br><b>Beispiele:</b> Kirchengemeinde; Umma.</p></div>
<div class="box"><h3>5. Heilige Schriften und Überlieferung</h3><p>Texte, die als Offenbarung oder als besonders wichtig gelten.<br><b>Beispiele:</b> Bibel; Koran und Sunna.</p></div>
<div class="box"><h3>6. Heilige Orte, Zeiten und Symbole</h3><p><b>Beispiele:</b> Kirche, Kreuz, Weihnachten und Ostern; Moschee, Kaaba, Qibla, Ramadan.</p></div>
<div class="box"><h3>7. Persönliche Erfahrung</h3><p>Das innere Erleben: Staunen, Ehrfurcht, Vertrauen, das Gefühl, getragen zu sein.<br><b>Beispiele:</b> Schleiermachers „Gefühl schlechthinniger Abhängigkeit“, Einsteins „Erfahrung des Mystischen“.</p></div>
<div class="img"><b>Zum Vorstellen:</b> Religion ist wie ein <b>Haus</b>. Die Glaubenslehre ist das Fundament, die Ethik sind die Hausregeln, die Rituale sind der Tagesablauf, die Gemeinschaft sind die Bewohner und die persönliche Erfahrung ist das Gefühl, darin zu Hause zu sein.</div>

<h3 class="sub">Die großen Fragen hinter der Religion</h3>
<p>Religionen antworten auf Fragen, die jeder Mensch irgendwann stellt:</p>
<ul><li><b>Woher</b> komme ich? (Ursprung, Schöpfung)</li>
<li><b>Wozu</b> lebe ich? (Sinn, Ziel)</li>
<li><b>Wie</b> soll ich leben? (Moral, Orientierung)</li>
<li><b>Warum</b> gibt es Leid? (Kontingenz)</li>
<li><b>Wohin</b> gehe ich? (Tod, Jenseits)</li></ul>
<p>Diese Fragen kann die Wissenschaft nicht vollständig beantworten. Genau hier setzt Religion an. Tillich nennt das die <b>Dimension der Tiefe</b>.</p>

<h3 class="sub">Zwei Blickwinkel auf Religion</h3>
<p>Man kann Religion auf zwei Arten betrachten. Das ist der rote Faden für diesen ganzen Teil:</p>
<div class="box"><p><b>Von innen (substanziell):</b> Was ist Religion selbst? Antwort: die Beziehung zum Heiligen, zu Gott, zum Unendlichen.</p>
<p><b>Von außen (funktional):</b> Was tut Religion für Menschen? Antwort: Sie gibt Sinn, Halt, Gemeinschaft, Orientierung und Trost.</p></div>

<h3 class="sub">Was Religion nicht ist</h3>
<ul><li>Religion ist <b>nicht dasselbe wie Wissen</b>. Glauben heißt vertrauen und überzeugt sein, ohne es beweisen zu können.</li>
<li>Religion ist <b>nicht nur Regeln</b>. Ohne innere Haltung bleiben Rituale leer.</li>
<li>Religion ist <b>nicht nur Gefühl</b>. Zu den meisten Religionen gehören auch Lehre, Handeln und Gemeinschaft.</li></ul>

<div class="tip"><b>Klausur-Tipp:</b> Wenn du gefragt wirst, was Religion ist, nenne zuerst das Problem (keine einheitliche Definition), dann die zwei Blickwinkel (substanziell und funktional) und dann ein Beispiel für jeden: „Substanziell: Schleiermacher, Religion als Gefühl für das Unendliche. Funktional: Kaufmann, Religion als Sinnstiftung, Kontingenzbewältigung usw.“</div>`},

{t:"Warum ist „Religion“ so schwer zu definieren?",h:`
<p>Jeder Mensch hat ein Gefühl dafür, was Religion ist. Soll man aber eine <b>genaue Definition</b> geben, wird es schwierig. Der Wissenschaftsjournalist <b>Ulrich Schnabel</b> zeigt das an zwei Versuchen:</p>
<div class="box"><h3>Versuch 1: „Religion ist der Glaube an einen allmächtigen Gott.“</h3>
<p>Das stimmt nicht immer. Der <b>Buddhismus</b> ist eine Religion, hat aber <b>keinen Gott</b>. Man nennt ihn deshalb eine „gottlose“ Religion. Die Definition schließt ihn also aus.</p></div>
<div class="box"><h3>Versuch 2: „Religion ist das, was Menschen Trost gibt.“</h3>
<p>Auch das reicht nicht. Religion kann Menschen auch <b>Angst machen</b>. Ein Beispiel ist die Vorstellung vom <b>Fegefeuer</b>: Sie erzeugt erst die Angst, die die Religion dann angeblich heilt.</p></div>
<p><b>Ergebnis:</b> Es gibt bis heute <b>keine Definition von Religion, der alle zustimmen</b>. Je nachdem, aus welcher Sicht man schaut (Philosophie, Soziologie, Psychologie, Theologie), meint man mit „Religion“ ganz unterschiedliche Dinge.</p>
<div class="img"><b>Zum Vorstellen:</b> Es ist wie mit dem Wort „Spiel“. Fußball, Schach und Verstecken sind alle Spiele, aber es ist sehr schwer, <i>ein</i> Merkmal zu finden, das alle gemeinsam haben.</div>`},

{t:"Woher kommt das Wort „Religion“?",h:`
<p>Das Wort kommt vom lateinischen <b>religio</b>. Für die Herkunft gibt es <b>zwei Erklärungen</b>, und jede betont etwas anderes:</p>
<div class="box"><h3>1. religare = „an- oder zurückbinden“</h3>
<p>Das ist die übliche Erklärung. Danach ist Religion die <b>Rückbindung des Menschen an eine höhere Wirklichkeit</b>, zum Beispiel an Gott.</p>
<p>Der Mensch ist also nicht allein, sondern mit etwas Größerem verbunden.</p></div>
<div class="box"><h3>2. relegere = „wieder auflesen, wieder aufsammeln“</h3>
<p>Diese Erklärung stammt vom römischen Politiker und Philosophen <b>Cicero</b>. Sie betont den Aspekt der <b>rituellen Wiederholung</b>: Religiöse Handlungen werden sorgfältig und immer wieder gleich ausgeführt.</p></div>
<div class="img"><b>Zum Vorstellen:</b> <b>religare</b> ist wie ein Seil, das den Menschen mit Gott verbindet. <b>relegere</b> ist wie das tägliche Gebet: dieselben Worte und Bewegungen, immer wieder, mit großer Sorgfalt.</div>
<div class="tip"><b>Klausur-Tipp:</b> Wenn ein Text von „Verbindung“ oder „Verbundenheit“ spricht, passt <b>religare</b>. Wenn er von Ritualen und Wiederholung spricht, passt <b>relegere</b>.</div>`},

{t:"Substanzielle und funktionale Definitionen",h:`
<p>Wissenschaftler haben zwei große Wege gefunden, Religion zu definieren. Das ist eines der <b>wichtigsten Themen</b> für die Klausur.</p>
<div class="box"><h3>Substanzielle Definition: „Was IST Religion?“</h3>
<p>Man fragt nach dem <b>Inhalt</b> von Religion. Religion wird definiert über ihren Bezug auf etwas <b>Transzendentes</b> (etwas, das über unsere Welt hinausgeht), auf das <b>Absolute</b> oder das <b>Heilige</b>.</p>
<p>Diese Sicht bevorzugen vor allem <b>Theologen</b>.</p></div>
<div class="box"><h3>Funktionale Definition: „Was LEISTET Religion?“</h3>
<p>Man fragt nach der <b>Aufgabe</b> von Religion. Religion wird definiert über das, was sie für den Einzelnen und für die Gesellschaft tut, zum Beispiel Gemeinschaft schaffen oder Trost spenden.</p>
<p>Diese Sicht haben vor allem <b>Soziologen, Psychologen und Ethnologen</b>.</p></div>
<div class="img"><b>Zum Vorstellen:</b> Ein Auto kann man auf zwei Arten erklären. <b>Substanziell:</b> „Ein Auto hat einen Motor, vier Räder und ein Lenkrad.“ <b>Funktional:</b> „Ein Auto bringt mich von A nach B.“</div>

<h3 class="sub">Wer sagt was? Die funktionalen Definitionen</h3>
<ul>
<li><b>Immanuel Kant</b> (Philosoph): Religion ist entweder eine „<b>Denknotwendigkeit</b>“ (man muss Gott denken, damit Moral Sinn ergibt) oder eine „<b>Denkmöglichkeit</b>“ (man kann Gott denken, aber nicht beweisen).</li>
<li><b>Émile Durkheim</b> (Soziologe): Religion ist „ein einheitliches <b>System von Glaubensvorstellungen und Praktiken</b> in Bezug auf das Heilige“. Ihm ist wichtig, dass Religion Menschen zu einer Gemeinschaft verbindet.</li>
<li><b>Sigmund Freud</b> (Psychologe): Religion ist eine <b>Massenneurose</b>, also eine Art seelische Störung vieler Menschen, die sich an einen „Vater-Gott“ klammern. Das ist eine sehr <b>kritische</b> Sicht.</li>
<li><b>Erich Fromm</b> (Psychologe): Religion ist eine <b>Institution</b> mit eigener <b>Hierarchie</b>, eigenen <b>Dogmen</b> (festen Lehrsätzen) und einem gewissen <b>Autoritarismus</b>.</li>
<li><b>Clifford Geertz</b> (Ethnologe): Religionen sind <b>kulturelle Zeichen- und Symbolsysteme</b>, so wie eine Sprache.</li>
</ul>

<h3 class="sub">Wer sagt was? Die substanziellen Definitionen</h3>
<ul>
<li><b>Friedrich Schleiermacher</b> (evangelischer Theologe): Religion ist der „<b>Sinn und Geschmack für das Unendliche</b>“ oder das „<b>Gefühl schlechthinniger Abhängigkeit</b>“. Das heißt: Der Mensch spürt, dass er sich nicht selbst gemacht hat und ganz von etwas Größerem abhängt.</li>
<li><b>Gustav Mensching</b> (Religionswissenschaftler): Religion ist die „<b>erlebnishafte Begegnung mit dem Heiligen</b> und antwortendes Handeln des vom Heiligen bestimmten Menschen“. Also: Erst erlebt man das Heilige, dann handelt man danach.</li>
<li><b>Johann Baptist Metz</b> (katholischer Theologe): Religion ist der „<b>Einbruch des göttlichen Heils</b>“, der das „Immer-weiter-so“ durchbricht. Seine kürzeste Formel für Religion lautet: <b>Unterbrechung</b>.</li>
</ul>

<h3 class="sub">Kritik an beiden Seiten</h3>
<div class="box"><h3>Kritik an der funktionalen Definition</h3>
<p>Viele Theologen sagen: Sie erfasst <b>das Wesentliche nicht</b>. Wenn Religion nur über ihre Aufgabe definiert wird, kann alles Mögliche eine Religion sein. Auch ein <b>Fußballverein</b> schafft Gemeinschaft, Rituale und Gefühle. Ist er dann eine Religion?</p></div>
<div class="box"><h3>Kritik an der substanziellen Definition</h3>
<p>Das „Heilige“ oder „Transzendente“ kann man <b>nicht beweisen oder messen</b>. Außerdem passen manche Religionen nicht gut hinein, zum Beispiel der Buddhismus ohne Gott.</p></div>
<div class="tip"><b>Klausur-Tipp:</b> Signalwörter für <b>substanziell</b>: das Heilige, das Unendliche, Gott, transzendent, Begegnung, Gefühl. Signalwörter für <b>funktional</b>: hilft, gibt, leistet, Aufgabe, Gemeinschaft, Trost, Orientierung.</div>`},

{t:"Die Anfänge der Religion (Härle)",h:`
<p>Der Theologe <b>Wilfried Härle</b> fragt: Seit wann gibt es Religion, und warum?</p>
<div class="box"><h3>Religion ist typisch menschlich</h3>
<p>Seit etwa <b>50 000 Jahren</b> gibt es rituelle Handlungen mit religiöser Bedeutung. Das unterscheidet den „modernen Menschen“ von früheren Menschenformen und von Tieren. Bei <b>Tieren</b> gibt es, soweit wir wissen, <b>keine religiösen Rituale</b>. Religion zeigt sich in der Evolution also als etwas <b>charakteristisch Menschliches</b>.</p></div>
<div class="box"><h3>Der Beweis: Grabbeigaben</h3>
<p>Die Körper der Toten zerfielen sichtbar. Trotzdem gab man ihnen <b>Nahrung, Schminke und Amulette</b> mit ins Grab. Ein Beispiel sind die Grabbeigaben für ein <b>Mädchen aus El Kubania in Ägypten</b> (ca. 20.–18. Jahrhundert v. Chr.): ein Holzkästchen mit Halsketten, Armband, Skarabäus und Schminkgefäßen.</p>
<p>Das zeigt: Die Menschen dachten über den <b>Tod hinaus</b>. Sie glaubten wohl an ein <b>Weiterleben nach dem Tod</b>. Diese Sorge um das Schicksal der Toten ist seitdem ein fester Teil von Kultur und Religion.</p></div>
<div class="box"><h3>Woher kommt das religiöse Fragen?</h3>
<p>Härle sagt: Religion entsteht aus einem <b>menschlichen Wissensdurst</b> und dem Gefühl einer <b>besonderen Bestimmung</b>.</p>
<ul><li>Es gibt den <b>technischen Wissensdrang</b>: Der Mensch will die Welt erfassen, erklären und beherrschen.</li>
<li>Daneben gibt es ein <b>religiöses Fragen</b>: Der Mensch fragt nach seinem Dasein <b>als Ganzem</b>. Er ist nicht zufrieden mit dem, was er sieht, sondern will wissen, <b>wohin sein Leben ausgerichtet ist</b> und worauf es letztlich hinausläuft.</li></ul></div>
<div class="img"><b>Zum Vorstellen:</b> Ein Kind fragt erst „Wie funktioniert das Auto?“ (technisch). Später fragt es „Warum bin ich überhaupt auf der Welt?“ (religiös).</div>`},

{t:"Die Dimension der Tiefe (Tillich)",h:`
<p><b>Paul Tillich</b> (1886–1965) war Theologe und Religionsphilosoph. Sein Text ist ein Hauptthema der Klausur.</p>
<div class="box"><h3>Seine These</h3>
<p>Das entscheidende Problem des heutigen westlichen Menschen ist der <b>Verlust der Dimension der Tiefe</b>.</p></div>
<div class="box"><h3>Was heißt „Dimension der Tiefe“?</h3>
<p>Es ist eine <b>Metapher</b> (ein Bild). Gemeint ist: Der Mensch hat die Antwort auf die Frage nach dem <b>Sinn seines Lebens</b> verloren. Er fragt nicht mehr:</p>
<ul><li><b>Woher</b> komme ich?</li><li><b>Wohin</b> gehe ich?</li><li><b>Was</b> soll ich tun?</li><li>Was soll ich aus mir machen in der <b>kurzen Zeit zwischen Geburt und Tod</b>?</li></ul>
<p>Tillich nennt diese Tiefe im Menschen seine <b>religiöse Dimension</b>.</p></div>
<div class="box"><h3>Was heißt „religiös sein“ für Tillich?</h3>
<p>Religiös sein bedeutet, <b>leidenschaftlich nach dem Sinn unseres Lebens zu fragen</b> und offen für Antworten zu sein, <b>auch wenn sie uns tief erschüttern</b>.</p></div>
<div class="box"><h3>Was Religion für Tillich NICHT ist</h3>
<ul><li>Sie ist <b>nicht nur</b> der Glaube an Götter oder an einen Gott.</li>
<li>Sie besteht <b>nicht nur</b> aus Handlungen und Einrichtungen (Gottesdienst, Kirche), in denen der Mensch seine Verbindung mit Gott zeigt.</li></ul>
<p>Die geschichtlichen Religionen sind zwar Religion in diesem Sinn, aber Religion ist <b>mehr</b>: Sie ist das <b>Sein des Menschen</b>, wenn es ihm um den Sinn seines Lebens geht.</p></div>
<div class="box"><h3>Das „unbedingte Anliegen“</h3>
<p>Religion ist das <b>„Ergriffensein von einem letzten, unbedingten Anliegen“</b>, also von dem, was uns <b>unbedingt angeht</b> und wichtiger ist als alles andere. Tillich sagt: Der typische moderne Mensch ist sich keines solchen Anliegens mehr bewusst.</p></div>
<div class="img"><b>Zum Vorstellen:</b> Das Leben ist wie ein Meer. Die meisten Menschen schwimmen nur an der <b>Oberfläche</b>: Arbeit, Handy, Freizeit. Religion heißt, <b>abzutauchen</b> und zu fragen, was darunter liegt.</div>
<div class="box"><h3>Was folgt daraus?</h3>
<ul><li>Religion wird <b>universal menschlich</b>: Jeder Mensch, der ernsthaft nach dem Sinn fragt, ist religiös, auch ohne Kirche oder Moschee.</li>
<li>Das weicht von dem ab, was man normalerweise unter Religion versteht.</li>
<li>Tillich ist Theologe, sein Ansatz ist eher <b>substanziell</b>. Er enthält aber auch die Funktion der <b>Sinnstiftung</b>.</li></ul></div>
<div class="tip"><b>Klausur-Tipp:</b> Tillich passt immer, wenn ein Text von Staunen, Sinn, Tiefe oder dem „Wesentlichen“ spricht, zum Beispiel bei Einstein.</div>`},

{t:"Die Funktionen von Religion (Kaufmann)",h:`
<p><b>Franz-Xaver Kaufmann</b> ist <b>Religionssoziologe</b>. Er fragt: Welche <b>Aufgaben</b> erfüllt Religion für Menschen und Gesellschaften? Das ist also ein <b>funktionaler</b> Religionsbegriff. Seine Funktionen erklären, warum Religion auch heute noch für viele Menschen wichtig ist.</p>
<div class="img"><b>Zum Merken:</b> Jede Funktion beantwortet eine Frage. <b>Wer bin ich?</b> · <b>Was soll ich tun?</b> · <b>Wie halte ich Leid aus?</b> · <b>Wo gehöre ich hin?</b> · <b>Wozu lebe ich?</b> · <b>Was ist ungerecht?</b></div>

<div class="box"><h3>1. Persönlichkeitsstärkung (Identität)</h3>
<p><b>Frage:</b> Wer bin ich?</p>
<p><b>Erklärung:</b> Religion hilft, das eigene Selbst und die eigene <b>Identität</b> zu bestimmen. Dadurch hilft sie bei der <b>Angstbewältigung</b> und gibt <b>Sicherheit</b>.</p>
<p><b>Beispiel Christentum:</b> „Ich bin ein von Gott geliebtes Kind.“ · <b>Beispiel Islam:</b> „Ich bin Muslim, also einer, der sich Gott hingibt.“</p>
<p class="note">Signalwörter im Text: Identität, Selbst, Sicherheit, Halt, Angst nehmen.</p></div>

<div class="box"><h3>2. Rituale, Moral und Orientierung (Handlungsführung)</h3>
<p><b>Frage:</b> Was soll ich tun?</p>
<p><b>Erklärung:</b> Religion gibt <b>Regeln</b>, <b>ethische Maßstäbe</b> und <b>Rituale</b>. Sie hilft vor allem in Situationen, die <b>nicht alltäglich</b> sind, wie Geburt, Hochzeit oder Tod. Das erleichtert Entscheidungen.</p>
<p><b>Beispiel Christentum:</b> die Zehn Gebote, Taufe, Hochzeit in der Kirche. · <b>Beispiel Islam:</b> die fünf Säulen, das tägliche Gebet, die Gebetsrichtung (Qibla).</p>
<p class="note">Signalwörter: Aufgabe, sollen, müssen, Regel, Gebot, Ritual, Weg.</p></div>

<div class="box"><h3>3. Kontingenzbewältigung</h3>
<p><b>Frage:</b> Wie halte ich Leid aus?</p>
<p><b>Erklärung:</b> „Kontingenz“ ist das, was <b>zufällig</b> passiert und was wir nicht kontrollieren können: <b>Leid, Verlust, Krankheit, Unrecht, Schicksalsschläge</b>. Religion hilft, solche Erfahrungen zu <b>verarbeiten</b> und damit umzugehen.</p>
<p><b>Beispiel Christentum:</b> Gebet am Krankenbett, Hoffnung auf Auferstehung bei einer Beerdigung. · <b>Beispiel Islam:</b> Glaube an das Schicksal (qadar): Alles Gute und Schlechte kommt von Gott.</p>
<p class="note">Signalwörter: Leid, Tod, Trost, Krise, Schicksal, Hoffnung.</p></div>

<div class="box"><h3>4. Sozialintegration (Gemeinschaft)</h3>
<p><b>Frage:</b> Wo gehöre ich hin?</p>
<p><b>Erklärung:</b> Religion <b>stiftet Gemeinschaft</b>. Gemeinsame Überzeugungen, Werte und Rituale verbinden Menschen miteinander. Das stärkt den <b>Zusammenhalt</b> der Gesellschaft.</p>
<p><b>Beispiel Christentum:</b> Gemeinde, Gottesdienst, Weihnachten. · <b>Beispiel Islam:</b> Umma (Gemeinschaft aller Muslime), Freitagsgebet, Ramadan, Hadsch.</p>
<p class="note">Signalwörter: wir, Gemeinschaft, verbunden, zusammen, Teil von.</p></div>

<div class="box"><h3>5. Sinnstiftung</h3>
<p><b>Frage:</b> Wozu lebe ich?</p>
<p><b>Erklärung:</b> Religion bietet ein <b>Sinnsystem</b>. Sie deutet die Welt und beantwortet Grundfragen nach <b>Ursprung, Ziel und Sinn des Lebens</b>. So verhindert sie das Gefühl von <b>Sinnlosigkeit und Chaos</b>.</p>
<p><b>Beispiel Christentum:</b> Gott hat die Welt aus Liebe geschaffen. · <b>Beispiel Islam:</b> Das Ziel des Lebens ist, Gottes Wohlgefallen zu erlangen (Sure 98:8).</p>
<p class="note">Signalwörter: Sinn, Ziel, warum, wozu, Ursprung, das Ganze.</p></div>

<div class="box"><h3>6. Kritik an Ungerechtigkeit (Weltdistanzierung)</h3>
<p><b>Frage:</b> Was ist ungerecht?</p>
<p><b>Erklärung:</b> Religion ermöglicht es, bestehende Verhältnisse zu <b>hinterfragen</b>, sich von <b>Unrecht zu distanzieren</b> und sich für eine <b>bessere, gerechtere Welt</b> einzusetzen.</p>
<p><b>Beispiel Christentum:</b> Martin Luther King, kirchliche Hilfe für Arme. · <b>Beispiel Islam:</b> Zakat (Pflichtabgabe für Arme); heilige Werte dürfen nicht für eigennützige Zwecke missbraucht werden.</p>
<p class="note">Signalwörter: befreien, Unrecht, Gerechtigkeit, Kritik, ändern.</p></div>

<div class="tip"><b>So ordnest du in der Klausur zu:</b><br>1. Funktion nennen → 2. kurz erklären, was sie bedeutet → 3. Textstelle mit Zeile zitieren → 4. erklären, warum die Stelle zur Funktion passt.<br><i>Beispiel: „Die Aussage, wer nicht mehr staunen könne, sei ‚so gut wie tot‘ (Z. 3f.), lässt sich der Sinnstiftung zuordnen. Denn für Einstein gibt erst das Staunen dem Leben einen Sinn.“</i></div>`},

{t:"Glaubensbekenntnisse im Vergleich",h:`
<p>Ein Glaubensbekenntnis ist eine <b>kurze Zusammenfassung</b> dessen, was eine Religion glaubt. Man lernt es auswendig und spricht es gemeinsam.</p>
<div class="box"><h3>Das christliche Glaubensbekenntnis</h3>
<p>Das wichtigste ist das <b>Apostolische Glaubensbekenntnis</b>. Es heißt auch „<b>Credo</b>“, lateinisch für „ich glaube“. Es wird im Gottesdienst und bei der Taufe gesprochen. Es hat <b>drei Teile</b>, entsprechend der <b>Dreifaltigkeit</b> (Trinität):</p>
<ol><li><b>Gott Vater:</b> Er ist allmächtig und hat Himmel und Erde geschaffen.</li>
<li><b>Jesus Christus:</b> Er ist Gottes eingeborener <b>Sohn</b>, vom Heiligen Geist empfangen, von der Jungfrau Maria geboren. Er hat gelitten, wurde gekreuzigt, ist gestorben und begraben worden. Am dritten Tag ist er <b>auferstanden</b>, in den Himmel aufgefahren und wird kommen, um zu <b>richten</b> über die Lebenden und die Toten.</li>
<li><b>Heiliger Geist:</b> Dazu gehören die heilige Kirche, die Gemeinschaft der Heiligen, die <b>Vergebung der Sünden</b>, die <b>Auferstehung der Toten</b> und das <b>ewige Leben</b>.</li></ol></div>
<div class="box"><h3>Das islamische Glaubensbekenntnis (kurz)</h3>
<p>Im Islam gibt es das <b>Glaubensbekenntnis (Āmantu)</b> mit sechs Glaubensinhalten und das <b>Glaubenszeugnis (Schahāda)</b>. Beides wird im islamischen Teil genau erklärt.</p></div>
<h3 class="sub">Gemeinsamkeiten</h3>
<ul>
<li>Beide beginnen mit „<b>ich glaube</b>“: Credo und Āmantu bedeuten dasselbe.</li>
<li>Beide glauben an <b>einen Gott</b>, der die Welt <b>erschaffen</b> hat.</li>
<li>Beide glauben an <b>Offenbarung</b>, an das <b>Jüngste Gericht</b>, die <b>Auferstehung</b> und ein Leben nach dem Tod.</li>
<li>Beide kennen <b>Jesus</b> und <b>Maria</b>.</li>
<li>Beide sind <b>kurze Formeln</b>, die man auswendig lernt und gemeinsam spricht. Sie geben <b>Identität</b> und schaffen <b>Gemeinschaft</b> (Kaufmann).</li>
</ul>
<h3 class="sub">Unterschiede</h3>
<div class="box"><h3>Das Gottesbild</h3><p><b>Christentum:</b> Gott ist <b>einer in drei Personen</b> (Vater, Sohn, Heiliger Geist). · <b>Islam:</b> Gott ist streng <b>Einer</b> (Tauḥīd). Er hat keinen Sohn und keine „Personen“.</p></div>
<div class="box"><h3>Jesus</h3><p><b>Christentum:</b> Jesus ist <b>Gottes Sohn</b>, er stirbt am Kreuz und steht auf. · <b>Islam:</b> Jesus (ʿĪsā) ist ein großer <b>Prophet</b>, aber nicht Gottes Sohn.</p></div>
<div class="box"><h3>Was zusätzlich vorkommt</h3><p><b>Christentum:</b> die <b>Kirche</b> und die Vergebung der Sünden. · <b>Islam:</b> <b>Muhammad</b> als Gesandter, die <b>Engel</b> und das <b>Schicksal</b>.</p></div>
<div class="box"><h3>Wann es gesprochen wird</h3><p><b>Christentum:</b> im Gottesdienst, bei Taufe und Konfirmation/Firmung. · <b>Islam:</b> beim Gebet, bei der Waschung, bei der Heirat und beim Eintritt in den Islam.</p></div>
<div class="img"><b>Zum Vorstellen:</b> Zwei Häuser auf <b>demselben Fundament</b> (ein Schöpfergott, Gericht, Jenseits), aber mit <b>unterschiedlichen Dächern</b> (Dreifaltigkeit und Tauḥīd).</div>`},

{t:"Das Wichtigste auf einen Blick",h:`
<ul class="sum">
<li>Es gibt <b>keine allgemein anerkannte Definition</b> von Religion.</li>
<li><b>religare</b> = zurückbinden (Verbindung zu Gott) · <b>relegere</b> = wieder auflesen (rituelle Wiederholung, Cicero).</li>
<li><b>Substanziell</b> = was Religion ist (das Heilige): Schleiermacher, Mensching, Metz.</li>
<li><b>Funktional</b> = was Religion leistet: Kant, Durkheim, Freud, Fromm, Geertz, Kaufmann.</li>
<li><b>Härle:</b> Religion gibt es seit ca. 50 000 Jahren, sichtbar an Grabbeigaben; sie entsteht aus dem Fragen nach dem Ganzen.</li>
<li><b>Tillich:</b> Der moderne Mensch hat die <b>Dimension der Tiefe</b> verloren. Religiös sein heißt, leidenschaftlich nach dem Sinn zu fragen; Religion ist das, was uns <b>unbedingt angeht</b>.</li>
<li><b>Kaufmann:</b> Persönlichkeitsstärkung · Rituale/Moral/Orientierung · Kontingenzbewältigung · Sozialintegration · Sinnstiftung · Kritik an Ungerechtigkeit.</li>
<li><b>Bekenntnisse:</b> gleiches Fundament (Schöpfergott, Gericht, Auferstehung), Unterschied bei Dreifaltigkeit und Jesus.</li>
</ul>`}
]};

PAGES.i={title:"Islamischer Teil",intro:"Hier lernst du, was das Wort <b>Islam</b> bedeutet (innere und äußere Dimension), was <b>Dīn</b> heißt, warum Religion im Islam eine <b>Ausrichtung</b> ist, was <b>Glaubensbekenntnis</b> und <b>Glaubenszeugnis</b> sind und was „glauben“ eigentlich bedeutet.",
chapters:[

{t:"Was bedeutet das Wort „Islam“?",h:`
<p><b>Islam</b> (<bdi class="ar">إسلام</bdi>) bedeutet auf Arabisch <b>Selbsthingabe an Gott</b>.</p>
<p>Im Kern bezeichnet Islam:</p>
<ul><li>den Glauben an die <b>Existenz</b> Gottes (Gott gibt es),</li>
<li>den Glauben an die <b>Einheit</b> Gottes (es gibt nur einen Gott),</li>
<li>und die <b>Hingabe</b> an Ihn.</li></ul>
<p>Ein <b>Muslim</b> ist dementsprechend „jemand, der sich Gott hingibt“.</p>
<div class="img"><b>Zum Vorstellen:</b> Hingabe ist wie bei einem Menschen, der einem guten Arzt ganz vertraut und sich ihm überlässt. Er sagt nicht „Ich weiß alles besser“, sondern „Ich vertraue dir.“</div>
<div class="tip"><b>Wichtig:</b> Das Wort Islam hat im Koran <b>zwei Bedeutungen</b>. Das nennt man die <b>innere</b> und die <b>äußere Dimension</b>. Das ist ein Kernthema der Klausur.</div>`},

{t:"Die innere Dimension des Islam",h:`
<p>In der <b>inneren</b> (allgemeinen) Bedeutung ist Islam eine <b>Haltung des Herzens</b>: die aufrichtige Hingabe an Gott.</p>
<div class="box"><h3>Was daraus folgt</h3>
<ul><li><b>Jeder Mensch</b>, der sich Gott aufrichtig hingibt, ist in diesem Sinn ein <b>Muslim</b>.</li>
<li>Darum wird im Koran schon <b>Abraham</b> „Muslim“ genannt, obwohl er lange vor Muhammad lebte. Er war jemand, der sich Gott ganz hingegeben hat.</li>
<li>Islam ist der allgemeine Name für die Religion, die <b>alle Propheten Gottes</b> verkündet haben, die im Koran genannten und auch die nicht genannten.</li>
<li>Die Offenbarungen von <b>Adam bis Muhammad</b> können in ihrer <b>Form</b> (Scharia, also die Regeln) unterschiedlich sein. In ihrem <b>Wesensgehalt</b>, also im Kern, sind sie aber <b>gleich</b> (Sure 5:48).</li></ul></div>
<div class="img"><b>Zum Vorstellen:</b> Ein Baum. Die <b>Wurzel</b> ist die Hingabe an Gott, und sie ist bei allen Propheten dieselbe. Die <b>Äste</b> sehen je nach Zeit verschieden aus.</div>`},

{t:"Die äußere Dimension des Islam",h:`
<p>In der <b>äußeren</b> (historischen) Bedeutung ist Islam der <b>Eigenname der Religion</b>, die der Prophet <b>Muhammad</b> verkündet hat.</p>
<div class="box"><h3>Was daraus folgt</h3>
<ul><li>Über Muhammad heißt es im Koran, er sei „der <b>erste</b> von denen, die sich Gott hingeben“ (Sure 6:14; 39:12).</li>
<li>Nach dieser Bedeutung ist <b>nur der ein Muslim</b>, der sich zu der von Muhammad verkündeten Religion <b>bekennt</b>.</li></ul></div>
<div class="box"><h3>Was zu dieser Religion gehört</h3>
<ul><li><b>Grundprinzip:</b> das Glaubenszeugnis: „Es gibt keine Gottheit außer Gott, und Muhammad ist Sein Diener und Gesandter.“</li>
<li><b>Glaubensinhalte:</b> Glaube an Engel, heilige Schriften, Propheten, das Jenseits und den Tag des Gerichts.</li>
<li><b>Basispflichten</b> (Säulen der religiösen Praxis): rituelles Gebet, Fasten, soziale Pflichtabgabe (Zakat) und Wallfahrt (Hadsch).</li>
<li><b>Gelehrte</b> interpretieren je nach Epoche die Hauptquellen <b>Koran und Sunna</b> neu (<i>idschtihad</i>) und versuchen, einen <b>Konsens</b> zu finden (<i>idschma</i>).</li></ul></div>
<h3 class="sub">Innen und außen im Vergleich</h3>
<div class="box"><p><b>Innere Dimension:</b> Haltung des Herzens · gilt für alle aufrichtigen Menschen · Beispiel Abraham.</p>
<p><b>Äußere Dimension:</b> konkrete Religion Muhammads · gilt für alle, die sich zu ihr bekennen · Schahāda und Säulen.</p></div>
<div class="tip"><b>Klausur-Satz:</b> „Der Begriff Islam hat eine innere Dimension, die Hingabe an Gott, die jeden aufrichtigen Menschen zum Muslim macht, und eine äußere Dimension, die historische Religion Muhammads mit Glaubenszeugnis und Säulen.“</div>`},

{t:"Glaube und Handeln gehören zusammen",h:`
<p>Im Islam ist Glaube <b>nicht nur etwas im Kopf</b>. Glaube muss sich im Leben zeigen.</p>
<div class="box"><h3>Gott ist Einer</h3>
<p>In deutlicher Abgrenzung zum <b>Polytheismus</b> (Glaube an viele Götter) ist Gott im Islam <b>Einer</b>. Er ist <b>einzigartig, ewig und transzendent</b> (über der Welt).</p>
<p>Der Mensch soll sich <b>niemandem anderen beugen als Gott</b>. Heilige Werte dürfen <b>nicht für eigennützige Zwecke</b> missbraucht werden.</p></div>
<div class="box"><h3>Das Ziel</h3>
<p>Das Ziel ist, <b>Gottes Wohlgefallen</b> zu erlangen (Sure 98:8). Der Mensch soll sich bewusst sein, dass <b>jedes Handeln einen religiösen Bezug</b> hat.</p></div>
<div class="box"><h3>Rechenschaft</h3>
<p>Für <b>jede Handlung und jedes Wort</b> muss man im Jenseits <b>Rechenschaft</b> ablegen.</p></div>
<div class="box"><h3>Glaube + rechtschaffenes Handeln</h3>
<p>In vielen Koranversen werden <b>Glaube und rechtschaffenes Handeln zusammen</b> genannt (z. B. 2:25, 2:82, 2:277; 4:57, 4:124). Sittliches Verhalten ist der <b>Widerschein des Glaubens</b>. Muhammad sah einwandfreies Verhalten als <b>Grundbedingung</b> des Muslimseins an.</p>
<p>Islam ist also <b>kein Glaube, der im Theoretischen bleibt</b>. Er zeigt sich im persönlichen Leben und in der Gesellschaft. Muhammad hat das <b>vorgelebt</b>.</p></div>
<div class="box"><h3>Harmonie mit allem</h3>
<p>Der Islam zielt auf das <b>Glück und Wohlbefinden</b> des Menschen. Er legt ihm eine <b>friedliche, liebevolle und harmonische Beziehung</b> nahe:</p>
<ul><li>zu <b>sich selbst</b>,</li><li>zu seinen <b>Mitmenschen</b>,</li><li>zu seinem <b>Schöpfer</b>,</li><li>und zum <b>gesamten Kosmos</b>.</li></ul></div>
<div class="tip"><b>Klausur-Tipp:</b> Die „Harmonie mit dem gesamten Kosmos“ ist ein sehr gutes Argument, wenn ein Text (wie der von Einstein) von Verbundenheit mit allem Leben spricht.</div>`},

{t:"Dīn – mehr als „Religion“",h:`
<p>Das arabische Wort für Religion ist <b>Dīn</b> (<bdi class="ar">دين</bdi>). Es bedeutet aber mehr als das deutsche Wort „Religion“. Es hat <b>drei Bedeutungen</b>:</p>
<div class="box"><h3>1. Religion, Lebensweise, Ordnung</h3>
<p>Religion ist ein <b>ganzer Lebensweg</b>, eine Ordnung für das ganze Leben, nicht nur ein Gebet am Freitag.</p></div>
<div class="box"><h3>2. Schuld, Verpflichtung</h3>
<p>Das Wort ist verwandt mit <i>dayn</i> = <b>Schuld</b>. Der Mensch „schuldet“ Gott etwas: Dank und Gehorsam, weil Gott ihm das Leben gegeben hat.</p></div>
<div class="box"><h3>3. Gericht, Vergeltung</h3>
<p><i>Yaum ad-Dīn</i> ist der <b>Tag des Gerichts</b> (Sure 1:4). An diesem Tag wird alles vergolten, was der Mensch getan hat.</p></div>
<p>Im Koran heißt es (Sure 3:19): Die Religion (Dīn) bei Gott ist der Islam, also die Hingabe.</p>
<div class="img"><b>Vergleich:</b> <b>religio</b> (lateinisch) heißt Rückbindung an etwas Höheres. <b>Dīn</b> heißt Lebensweg, Verpflichtung und Verantwortung vor Gott. Beide zeigen: Religion verbindet den Menschen mit etwas Höherem.</div>
<p class="note">Hinweis: Dieses Thema stand nicht auf deinen Arbeitsblättern. Vergleiche es mit deinem Heft.</p>`},

{t:"Islam als Ausrichtung",h:`
<p>Religion bedeutet im Islam auch: <b>sich ausrichten</b>. Die Ausrichtung hat zwei Seiten:</p>
<ul><li>eine <b>topografische</b> Seite (im Raum, in eine Richtung),</li>
<li>und eine <b>psychologische</b> Seite (innerlich, mit dem Herzen).</li></ul>
<p>Drei arabische Begriffe zeigen das:</p>
<div class="box"><h3>Widschha (<bdi class="ar">وجهة</bdi>), Sure 2:148–152</h3>
<p>Wörtlich: das „<b>Gesicht</b>“. Das Gesicht ist ein <b>Bild für die Ausrichtung der ganzen Person</b>.</p>
<p>Im Deutschen gibt es etwas Ähnliches: Wer „<b>sein Gesicht verliert</b>“, hat nicht seine Haut verloren, sondern sein <b>Ansehen, seinen Erfolg, seine Ehre</b>.</p>
<p>Dieser Erfolg heißt im Koran und im Gebetsruf <b>falāḥ</b> (<bdi class="ar">فلاح</bdi>), Erfolg bei Gott. Den erreicht der Mensch, indem er sich <b>innerlich ganz auf Gott ausrichtet</b>.</p></div>
<div class="box"><h3>Qibla (<bdi class="ar">قبلة</bdi>), Sure 2:177</h3>
<p>Von <i>qibala</i> = „<b>in Richtung auf</b>“. Gemeint ist die <b>Gebetsrichtung</b>. Muslime beteten zuerst Richtung <b>Jerusalem</b>, später Richtung <b>Mekka</b>.</p>
<p>Das ist der <b>topografische</b> Aspekt der Ausrichtung. Er steht für die Ausrichtung der ganzen religiösen Lebensweise. So etwas gibt es in vielen Religionen.</p></div>
<div class="box"><h3>Tauba (<bdi class="ar">توبة</bdi>), Sure 25:71</h3>
<p>Wörtlich: „<b>Drehung</b>“, „Rotation“. Gemeint ist die <b>Umkehr</b>: Wer seinen Kurs aus den Augen verloren hat, nimmt ihn wieder auf.</p>
<p>Frei übersetzt: „Wer bereut, der richtet sich wieder auf Gott aus, in aufrichtiger Veränderung.“</p>
<p>Tauba nur mit „Reue“ zu übersetzen, ist zu wenig. Viele Muslime verbinden damit ein <b>bestimmtes Verfahren</b>:</p>
<ol><li><b>Reue</b> (es tut mir leid),</li><li><b>Absichtserklärung</b> (ich will es nicht wieder tun),</li><li><b>Schadensbehebung</b> (ich mache den Schaden wieder gut).</li></ol></div>
<div class="img"><b>Zum Vorstellen:</b> wie ein Navi. <b>Widschha:</b> Du drehst dich zum Ziel. <b>Qibla:</b> die Richtung auf der Karte. <b>Tauba:</b> „Route wird neu berechnet“, nachdem du falsch abgebogen bist.</div>`},

{t:"Das Glaubensbekenntnis (Āmantu)",h:`
<p>Das Glaubensbekenntnis heißt auf Arabisch <b>Āmantu</b>, auf Türkisch <b>Âmentü</b>. Das Wort bedeutet „<b>ich glaube</b>“ und kommt auch im Koran vor (z. B. 10:90; 36:25; 42:15).</p>
<p>Es ist die kurze <b>Aufzählung der sechs Glaubensprinzipien</b>:</p>
<div class="box"><ol class="big">
<li><b>Gott:</b> Es gibt nur einen Gott. Das ist die <b>Grundlage</b> von allem.</li>
<li><b>Die Engel:</b> Gottes Boten, z. B. Gabriel, der Muhammad den Koran brachte.</li>
<li><b>Die Offenbarungsschriften:</b> Thora, Psalmen, Evangelium und Koran.</li>
<li><b>Die Propheten:</b> von Adam über Abraham, Mose und Jesus bis Muhammad.</li>
<li><b>Die Auferstehung und das Jüngste Gericht:</b> Nach dem Tod folgt ohne Zweifel die Auferstehung.</li>
<li><b>Das Schicksal (qadar):</b> Alles Gute und Böse, das mir widerfährt, kommt von Gott.</li></ol></div>
<div class="box"><h3>Die Formel</h3>
<p>Sinngemäß: „Ich glaube an Gott, an Seine Engel, an Seine Bücher, an Seine Propheten, an das Jüngste Gericht und an das Schicksal, nämlich dass alles Gute und Böse von Gott kommt. Nach dem Tod wird ohne Zweifel die Auferstehung folgen. Ich bezeuge, dass es keine Gottheit gibt außer Gott und dass Muhammad Sein Diener und Gesandter ist.“</p></div>
<div class="box"><h3>Woher kommen die sechs Prinzipien?</h3>
<ul><li><b>Fünf</b> von ihnen stehen in unterschiedlicher Form im <b>Koran</b> (2:136, 177, 285; 4:136).</li>
<li>Nur der Glaube an das <b>Schicksal</b> steht nicht im Koran als Teil des Bekenntnisses. Er wird in manchen <b>Hadith-Sammlungen</b> genannt (Bukhari), in anderen nicht (Muslim).</li>
<li>Der Glaube an den <b>einen Gott</b> ist die Grundlage. Daraus folgt der Glaube an Seine Bücher, Propheten, Engel und das Jenseits.</li>
<li><b>Abu Hanifa</b> (gest. 767), der Gründer der <b>hanafitischen Rechtsschule</b>, hat diese Prinzipien in seinem Hauptwerk „Die Fundamente des Glaubens“ (<i>al-Fiqh al-Akbar</i>) formuliert.</li></ul></div>
<div class="box"><h3>Im Alltag</h3>
<ul><li>Muslime lernen das Bekenntnis schon <b>als Kinder auswendig</b>.</li>
<li>Es wird bei vielen Gelegenheiten <b>auf Arabisch</b> gesprochen: bei der <b>rituellen Waschung</b>, beim <b>Sündenbekenntnis (Tauba)</b> und bei der <b>Eheschließung</b>.</li></ul></div>`},

{t:"Das Glaubenszeugnis (Schahāda)",h:`
<p>Das Glaubenszeugnis heißt auf Arabisch <b>Kalima asch-Schahāda</b>, auf Türkisch Kelime-i Şehadet. Man <b>bekundet</b> damit seinen Glauben, man „legt <b>Zeugnis</b> ab“.</p>
<div class="box"><h3>Der Wortlaut</h3>
<p>„<b>Ich bezeuge, dass es keine Gottheit außer Gott gibt, und ich bezeuge, dass Muhammad Sein Diener und Gesandter ist.</b>“</p>
<p class="note">Arabisch: aschhadu an lā ilāha illā-llāh wa-aschhadu anna Muḥammadan ʿabduhu wa-rasūluhu.</p></div>
<div class="box"><h3>Was die zwei Teile bedeuten</h3>
<p><b>Teil 1: „Keine Gottheit außer Gott“.</b> Wer das sagt, bestätigt seinen Glauben an die <b>Existenz, Erhabenheit und Einheit Gottes</b>.</p>
<p><b>Teil 2: „Muhammad ist Sein Diener und Gesandter“.</b> Wer das anerkennt, akzeptiert damit automatisch auch die anderen Glaubensinhalte, die Muhammad überbracht hat: die Propheten, die Engel, die Offenbarungsbücher und das Jenseits. Wer an den Gesandten glaubt, erkennt auch die <b>Gebote</b> an, die er übermittelt hat.</p></div>
<div class="box"><h3>Warum es so wichtig ist</h3>
<ul><li>Es ist die <b>erste Voraussetzung, um Muslim zu werden</b>.</li>
<li>Wer es <b>aufrichtig</b> spricht, gilt als Gläubiger und Muslim.</li>
<li>Muhammad nennt es in einem Hadith den <b>ersten Grundsatz des Islam</b> (überliefert bei Muslim).</li>
<li>Wer sich für den Islam entscheidet, muss <b>zuerst</b> das Glaubenszeugnis sprechen.</li></ul></div>
<div class="box"><h3>Die Kurzform: Bekenntnis zur Einheit</h3>
<p>„Es gibt keine Gottheit außer Gott und Muhammad ist der Gesandte Gottes“ (<i>lā ilāha illā-llāh, Muḥammadun rasūlu-llāh</i>). Diese Formel heißt auch <b>Kalima at-Tauḥīd</b>, das <b>Bekenntnis zur Einheit</b> Gottes.</p></div>`},

{t:"Bekenntnis und Zeugnis im Vergleich",h:`
<div class="box"><h3>Gemeinsam</h3>
<ul><li>Die <b>Botschaft</b> beider Texte ist <b>im Kern gleich</b>.</li>
<li>In beiden wird der Glaube <b>kurz zusammengefasst</b>.</li>
<li>Glaubenszeugnis und Bekenntnis zur Einheit sind die <b>kürzesten Formulierungen</b> des Glaubens.</li></ul></div>
<div class="box"><h3>Unterschiedlich</h3>
<p><b>Glaubensbekenntnis (Āmantu):</b> beginnt mit „Ich glaube …“ · eine <b>ausführliche Liste</b> von sechs Inhalten · sagt, <b>was</b> ich glaube.</p>
<p><b>Glaubenszeugnis (Schahāda):</b> beginnt mit „<b>Ich bezeuge</b> …“, deshalb heißt es „Zeugnis“ · ein <b>kurzer Satz</b> · ein öffentliches Zeugnis <b>vor anderen</b> · nötig, um Muslim zu werden.</p></div>
<div class="img"><b>Zum Vorstellen:</b> Das Bekenntnis ist wie ein <b>ganzer Vertrag</b> mit allen Punkten. Das Zeugnis ist die <b>Unterschrift</b> darunter. Mit der Unterschrift akzeptiert man den ganzen Vertrag.</div>
<p>Zu diesem Thema ist in der islamischen Tradition ein reiches Schrifttum entstanden.</p>`},

{t:"Was heißt „glauben“?",h:`
<p>Das Wort „glauben“ hat im Deutschen <b>drei verschiedene Bedeutungen</b>:</p>
<div class="box"><h3>1. Bereich Wissen: vermuten</h3>
<p>„Glauben“ heißt hier: etwas für wahr halten, <b>ohne sicher zu sein</b>.</p>
<p><i>„Ich glaube, morgen regnet es.“</i></p></div>
<div class="box"><h3>2. Zwischenmenschlicher Bereich: vertrauen</h3>
<p>„Glauben“ heißt hier: einem Menschen <b>vertrauen</b>, sich auf ihn <b>verlassen</b>.</p>
<p><i>„Ich glaube dir.“</i></p></div>
<div class="box"><h3>3. Bereich Religion: überzeugt sein und sich hingeben</h3>
<p>„Glauben“ heißt hier: fest <b>überzeugt</b> sein, Gott <b>vertrauen</b> und sich ihm <b>hingeben</b>, auch wenn man es nicht beweisen kann.</p>
<p><i>„Ich glaube an Gott.“</i></p></div>
<h3 class="sub">Die Skala von unsicher bis sicher</h3>
<div class="scale"><div style="background:#b5524d">vermuten</div><div style="background:#c27a3f">meinen</div><div style="background:#a8923a">annehmen</div><div style="background:#5a8f4a">überzeugt sein</div><div style="background:#2f7058">wissen</div></div>
<p><b>Wissen</b> geht über das Glauben hinaus und gehört in den <b>Bereich des Wissens</b>, denn es ist beweisbar.</p>
<h3 class="sub">Lösung zum Arbeitsblatt</h3>
<div class="box"><ul>
<li><b>a)</b> Der Patient glaubt dem Arzt → er <b>vertraut</b> ihm → zwischenmenschlich</li>
<li><b>b)</b> Marc glaubt, dass Julie ihn belogen hat → er <b>vermutet</b> es → Wissen</li>
<li><b>c)</b> Christen und Muslime glauben an ein Leben nach dem Tod → sie <b>sind überzeugt / hoffen</b> → Religion</li>
<li><b>d)</b> Judith glaubt, dass Tom sie nicht allein lässt → sie <b>verlässt sich</b> auf ihn → zwischenmenschlich</li>
<li><b>e)</b> Kinder glauben ihren Eltern alles → sie <b>vertrauen</b> ihnen → zwischenmenschlich</li>
<li><b>f)</b> Muslime, Juden und Christen glauben, dass Gott sie geschaffen hat → sie <b>sind überzeugt</b> → Religion</li>
<li><b>g)</b> Martin geht ins Kloster, weil er an Gott glaubt → er <b>vertraut</b> Gott und <b>gibt sich hin</b> → Religion</li>
<li><b>h)</b> Die Kreationisten glauben nicht an die Evolution → sie <b>halten sie für falsch</b> → Wissen</li></ul></div>
<div class="img"><b>Interessant:</b> Āmantu („ich glaube“) hat dieselbe Wurzel wie <i>amn</i> (Sicherheit) und <i>amāna</i> (Vertrauen). Religiöser Glaube im Islam ist also <b>Vertrauen</b>, nicht nur „Vermuten“.</div>`},

{t:"Strömungen nach Muhammads Tod",h:`
<p>Nach dem Tod Muhammads (<b>632</b>) entstanden durch politische, soziale und kulturelle Entwicklungen <b>verschiedene Denkrichtungen</b>.</p>
<p>Unter dem dritten Kalifen <b>Uthman</b> (644–656) kam es zu politischen Streitigkeiten. Man diskutierte: Wer von den verfeindeten Parteien ist im Recht? Werden die Gefallenen im Jenseits bestraft oder belohnt?</p>
<div class="box"><h3>Kharidschiten</h3>
<p><b>Ali</b>, Vetter und Schwiegersohn des Propheten, akzeptierte im Streit mit <b>Muawiya</b> einen Schiedsrichter. Einige Anhänger verließen ihn deshalb: Er habe das Urteil eines Menschen über das Urteil Gottes gestellt. Sie beschuldigten ihn des Unglaubens.</p>
<p>Später sagten sie: Wer <b>schwere Sünden</b> begeht, wird zum <b>Abtrünnigen</b>. Sie neigten zur <b>Intoleranz</b>.</p></div>
<div class="box"><h3>Murdschiten</h3>
<p>Die Gegner dieser Ansicht sagten: Das Urteil über die Toten des Bürgerkriegs und über Sünder liegt <b>allein bei Gott</b>. Sünden schaden dem Glauben <b>nicht</b>, egal wie groß sie sind.</p></div>
<div class="box"><h3>Schiiten</h3>
<p>Sie unterstützten Ali <b>bedingungslos</b>. Sie waren überzeugt, dass die Leitung der Muslime <b>nur Ali und seinen Nachkommen</b> zusteht, und stützten sich dabei auf Koran und Prophet.</p></div>`},

{t:"Alle wichtigen Begriffe des Islam",h:`<p>Hier findest du alle wichtigen Begriffe des Islam mit <b>arabischer Schrift</b>, <b>Bedeutung</b> und <b>Erklärung</b>, nach Themen sortiert. Begriffe, die direkt in euren Texten vorkommen, sind ein Muss für die Klausur. Die anderen helfen dir, Zusammenhänge zu verstehen und Zusatzpunkte zu holen.</p><h3 class="sub">Grundbegriffe</h3><div class="gl"><div class="glh"><b>Islām</b><bdi class="ar">إسلام</bdi></div><div class="glm">„Selbsthingabe an Gott“</div><p>Kern des Islam ist der Glaube an die Existenz und die Einheit Gottes und die Hingabe an Ihn. Das Wort hat eine <b>innere</b> Bedeutung (die Hingabe des Herzens, die jeden aufrichtigen Menschen zum Muslim macht, z. B. Abraham) und eine <b>äußere</b> Bedeutung (die von Muhammad verkündete Religion). Es kommt von der Wurzel <b>s-l-m</b>, zu der auch salām (Frieden) gehört.</p></div><div class="gl"><div class="glh"><b>Muslim</b><bdi class="ar">مسلم</bdi></div><div class="glm">„einer, der sich Gott hingibt“</div><p>Im inneren Sinn jeder Mensch, der sich Gott aufrichtig hingibt. Im äußeren Sinn jemand, der sich zur Religion Muhammads bekennt. Die weibliche Form ist <i>Muslima</i>.</p></div><div class="gl"><div class="glh"><b>Allāh</b><bdi class="ar">الله</bdi></div><div class="glm">„Gott“</div><p>Das arabische Wort für Gott. Es ist kein Eigenname eines „anderen“ Gottes. Auch arabische Christen beten zu „Allāh“. Muslime glauben, dass es derselbe Gott ist, an den auch Juden und Christen glauben, verstehen Ihn aber streng als <b>Einen</b>.</p></div><div class="gl"><div class="glh"><b>Dīn</b><bdi class="ar">دين</bdi></div><div class="glm">„Religion, Lebensweise“</div><p>Mehr als das deutsche Wort „Religion“: Dīn bedeutet <b>Lebensweg und Ordnung</b>, <b>Verpflichtung</b> (verwandt mit <i>dayn</i> = Schuld) und <b>Gericht</b> (<i>Yaum ad-Dīn</i> = Tag des Gerichts, Sure 1:4). Sure 3:19: Die Religion bei Gott ist der Islam.</p></div><div class="gl"><div class="glh"><b>Tauḥīd</b><bdi class="ar">توحيد</bdi></div><div class="glm">„Einheit Gottes“</div><p>Der wichtigste Grundsatz des Islam: Gott ist <b>Einer</b>, einzigartig, ewig und transzendent. Er hat keine Teilhaber, keine Kinder und nichts ist Ihm gleich (Sure 112). Das Gegenteil ist <b>Schirk</b>.</p></div><div class="gl"><div class="glh"><b>Schirk</b><bdi class="ar">شرك</bdi></div><div class="glm">„Beigesellung“</div><p>Gott etwas oder jemanden „beigesellen“, also etwas anderes neben Gott anbeten oder wie Gott behandeln. Schirk gilt als die <b>schwerste Sünde</b>. Auch Geld, Macht oder Ruhm können zu einem „Götzen“ werden, wenn man ihnen alles unterordnet.</p></div><div class="gl"><div class="glh"><b>Īmān</b><bdi class="ar">إيمان</bdi></div><div class="glm">„Glaube“</div><p>Der innere Glaube des Herzens an die sechs Glaubensprinzipien. Das Wort ist verwandt mit <i>amn</i> (Sicherheit) und <i>amāna</i> (Vertrauen): Glauben heißt <b>vertrauen</b>. Ein Gläubiger heißt <i>Muʾmin</i>.</p></div><div class="gl"><div class="glh"><b>Iḥsān</b><bdi class="ar">إحسان</bdi></div><div class="glm">„das Gute tun, Vollkommenheit“</div><p>Die höchste Stufe der Religion: Gott so zu dienen, <b>als ob man Ihn sähe</b>, denn auch wenn man Ihn nicht sieht, sieht Er einen. Im bekannten Gabriel-Hadith gibt es drei Stufen: <b>Islām</b> (die äußere Praxis), <b>Īmān</b> (der innere Glaube) und <b>Iḥsān</b> (die Vollkommenheit). Das passt gut zur inneren und äußeren Dimension.</p></div><div class="gl"><div class="glh"><b>Fiṭra</b><bdi class="ar">فطرة</bdi></div><div class="glm">„natürliche Veranlagung“</div><p>Nach islamischer Lehre wird jeder Mensch mit einer angeborenen Neigung zu Gott geboren (Sure 30:30). Religion ist also <b>im Menschen angelegt</b>. Das ist ein gutes Argument dafür, warum Glaube tief im Menschen verwurzelt ist.</p></div><div class="gl"><div class="glh"><b>Raḥma</b><bdi class="ar">رحمة</bdi></div><div class="glm">„Barmherzigkeit“</div><p>Eine zentrale Eigenschaft Gottes. Fast jede Sure beginnt mit der <b>Basmala</b>: „Im Namen Gottes, des Allerbarmers, des Barmherzigen“ (bismi-llāhi r-raḥmāni r-raḥīm). Khorchides Buch heißt „Islam ist Barmherzigkeit“.</p></div><h3 class="sub">Glaubensinhalte (Āmantu)</h3><div class="gl"><div class="glh"><b>Āmantu</b><bdi class="ar">آمنت</bdi></div><div class="glm">„ich glaube“</div><p>Das <b>Glaubensbekenntnis</b> mit den sechs Glaubensprinzipien: Gott, Engel, Offenbarungsschriften, Propheten, Auferstehung und Jüngstes Gericht, Schicksal. Formuliert von <b>Abu Hanifa</b> (gest. 767). Es wird bei der Waschung, bei der Tauba und bei der Heirat gesprochen.</p></div><div class="gl"><div class="glh"><b>Malāʾika</b><bdi class="ar">ملائكة</bdi></div><div class="glm">„Engel“</div><p>Geschöpfe Gottes, die Seine Befehle ausführen. Der wichtigste ist <b>Dschibrīl</b> (Gabriel), der Muhammad den Koran überbrachte. Engel haben keinen freien Willen wie Menschen.</p></div><div class="gl"><div class="glh"><b>Kutub</b><bdi class="ar">كتب</bdi></div><div class="glm">„die (heiligen) Bücher“</div><p>Die Offenbarungsschriften: <b>Taurāt</b> (Thora, an Mose), <b>Zabūr</b> (Psalmen, an David), <b>Indschīl</b> (Evangelium, an Jesus) und der <b>Qurʾān</b> (an Muhammad). Im Kern haben sie dieselbe Botschaft (Sure 5:48).</p></div><div class="gl"><div class="glh"><b>Nabī und Rasūl</b><bdi class="ar">نبي / رسول</bdi></div><div class="glm">„Prophet und Gesandter“</div><p>Ein <b>Nabī</b> (Prophet) ist ein Mensch, dem Gott Offenbarung gibt. Ein <b>Rasūl</b> (Gesandter) bringt zusätzlich eine eigene Schrift oder Botschaft für ein Volk. Von Adam über Noah, Abraham, Mose und Jesus bis <b>Muhammad</b>, dem letzten Propheten („Siegel der Propheten“).</p></div><div class="gl"><div class="glh"><b>Qadar</b><bdi class="ar">قدر</bdi></div><div class="glm">„Schicksal, Vorherbestimmung“</div><p>Der Glaube, dass alles Gute und Böse, das einem widerfährt, von Gott kommt. Er steht nur in manchen Hadith-Sammlungen als Teil des Bekenntnisses (Bukhari ja, Muslim nein). Für Kaufmann gehört er zur <b>Kontingenzbewältigung</b>.</p></div><div class="gl"><div class="glh"><b>Āchira</b><bdi class="ar">آخرة</bdi></div><div class="glm">„das Jenseits“</div><p>Das Leben nach dem Tod. Nach der <b>Auferstehung</b> (<i>Yaum al-Qiyāma</i>) folgt das <b>Jüngste Gericht</b> (<i>Yaum ad-Dīn</i>). Jeder Mensch legt Rechenschaft für jedes Wort und jede Tat ab. Danach kommt das Paradies (<b>Dschanna</b>, auch <i>dār as-salām</i>, „Haus des Friedens“) oder die Hölle (<b>Dschahannam</b>).</p></div><h3 class="sub">Die Bekenntnisformeln</h3><div class="gl"><div class="glh"><b>Schahāda</b><bdi class="ar">شهادة</bdi></div><div class="glm">„Glaubenszeugnis“</div><p>„Ich bezeuge, dass es keine Gottheit außer Gott gibt, und ich bezeuge, dass Muhammad Sein Diener und Gesandter ist.“ Die <b>erste Voraussetzung</b>, um Muslim zu werden, und die erste der fünf Säulen. Wer Muhammad als Gesandten anerkennt, akzeptiert damit auch Engel, Bücher und Jenseits.</p></div><div class="gl"><div class="glh"><b>Kalima at-Tauḥīd</b><bdi class="ar">كلمة التوحيد</bdi></div><div class="glm">„Bekenntnis zur Einheit“</div><p>Die Kurzform: „Es gibt keine Gottheit außer Gott, Muhammad ist der Gesandte Gottes“ (lā ilāha illā-llāh, Muḥammadun rasūlu-llāh). Zusammen mit der Schahāda die <b>kürzeste</b> Formulierung des Glaubens.</p></div><h3 class="sub">Die religiöse Praxis (fünf Säulen)</h3><div class="gl"><div class="glh"><b>Ṣalāt</b><bdi class="ar">صلاة</bdi></div><div class="glm">„rituelles Gebet“</div><p>Das Pflichtgebet <b>fünfmal am Tag</b> zu festen Zeiten, in Richtung <b>Qibla</b> (Mekka). Es besteht aus festen Bewegungen (Stehen, Verbeugen, Niederwerfen) und Koranversen. Vorher macht man die rituelle Waschung (<b>Wuḍūʾ</b>).</p></div><div class="gl"><div class="glh"><b>Ṣaum</b><bdi class="ar">صوم</bdi></div><div class="glm">„Fasten“</div><p>Im Monat <b>Ramadan</b> verzichten Muslime von der Morgendämmerung bis zum Sonnenuntergang auf Essen, Trinken und andere Bedürfnisse. Es soll Selbstbeherrschung, Dankbarkeit und Mitgefühl mit Armen stärken. Am Ende steht das Fest des Fastenbrechens.</p></div><div class="gl"><div class="glh"><b>Zakāt</b><bdi class="ar">زكاة</bdi></div><div class="glm">„soziale Pflichtabgabe“</div><p>Jeder Muslim, der genug besitzt, gibt jedes Jahr einen Teil (meist <b>2,5 %</b> des Ersparten) an Bedürftige. Das Wort bedeutet auch „Reinigung“: Das Geben reinigt den Besitz und das Herz. Passt zu Kaufmanns Funktion <b>Kritik an Ungerechtigkeit</b>.</p></div><div class="gl"><div class="glh"><b>Ḥaddsch</b><bdi class="ar">حج</bdi></div><div class="glm">„Wallfahrt nach Mekka“</div><p>Jeder Muslim, der gesund ist und es sich leisten kann, soll <b>einmal im Leben</b> nach Mekka pilgern. Dort umrunden die Pilger die <b>Kaaba</b>. Alle tragen einfache weiße Kleidung: Vor Gott sind alle gleich (<b>Sozialintegration</b>).</p></div><div class="gl"><div class="glh"><b>Wuḍūʾ</b><bdi class="ar">وضوء</bdi></div><div class="glm">„rituelle Waschung“</div><p>Waschung von Händen, Mund, Nase, Gesicht, Armen, Kopf und Füßen vor dem Gebet. Sie steht für <b>äußere und innere Reinheit</b>. Dabei wird oft das Glaubensbekenntnis gesprochen.</p></div><div class="gl"><div class="glh"><b>Kaaba</b><bdi class="ar">الكعبة</bdi></div><div class="glm">„der Würfel“</div><p>Das würfelförmige Heiligtum in Mekka, nach islamischer Überlieferung von <b>Abraham</b> und Ismael errichtet. Es ist der Mittelpunkt der Qibla und der Wallfahrt.</p></div><div class="gl"><div class="glh"><b>Masdschid</b><bdi class="ar">مسجد</bdi></div><div class="glm">„Moschee“</div><p>Wörtlich „Ort der Niederwerfung“. Hier beten Muslime gemeinsam, besonders beim <b>Freitagsgebet</b>. Der <b>Imām</b> ist der Vorbeter.</p></div><div class="gl"><div class="glh"><b>ʿIbāda</b><bdi class="ar">عبادة</bdi></div><div class="glm">„Gottesdienst“</div><p>Nicht nur das Gebet: Jede gute Handlung, die man mit der richtigen <b>Absicht</b> (<i>niyya</i>) für Gott tut, ist ʿIbāda. Das zeigt: Im Islam hat <b>jegliches Handeln einen religiösen Bezug</b>.</p></div><div class="gl"><div class="glh"><b>Duʿāʾ</b><bdi class="ar">دعاء</bdi></div><div class="glm">„Bittgebet“</div><p>Das freie, persönliche Gebet in eigenen Worten, in jeder Sprache und zu jeder Zeit. Anders als die Ṣalāt hat es keine feste Form.</p></div><h3 class="sub">Quellen und Gelehrsamkeit</h3><div class="gl"><div class="glh"><b>Qurʾān</b><bdi class="ar">القرآن</bdi></div><div class="glm">„Koran, „Lesung, Vortrag““</div><p>Das heilige Buch des Islam. Muslime glauben, dass es das <b>wörtliche Wort Gottes</b> ist, das Muhammad über ca. 23 Jahre (610–632) durch den Engel Gabriel offenbart wurde. Es hat <b>114 Suren</b> (Kapitel), die aus <b>Āyāt</b> (Versen) bestehen.</p></div><div class="gl"><div class="glh"><b>Āya</b><bdi class="ar">آية</bdi></div><div class="glm">„Vers, Zeichen“</div><p>Ein Vers des Koran. Das Wort bedeutet auch „<b>Zeichen</b>“: Die ganze Schöpfung (Himmel, Natur, der Mensch) ist voller Zeichen Gottes, über die man nachdenken soll. Gut für Vergleiche mit Einsteins Staunen.</p></div><div class="gl"><div class="glh"><b>Sunna</b><bdi class="ar">سنة</bdi></div><div class="glm">„Brauch, Lebenspraxis“</div><p>Die Lebensweise und das Vorbild des Propheten Muhammad: was er gesagt, getan und erlaubt hat. Neben dem Koran die <b>zweite Hauptquelle</b> des Islam.</p></div><div class="gl"><div class="glh"><b>Ḥadīth</b><bdi class="ar">حديث</bdi></div><div class="glm">„Überlieferung, Bericht“</div><p>Ein überlieferter Bericht über einen Ausspruch oder eine Handlung Muhammads. Die wichtigsten Sammlungen sind die von <b>Bukhari</b> und <b>Muslim</b>.</p></div><div class="gl"><div class="glh"><b>Scharia</b><bdi class="ar">شريعة</bdi></div><div class="glm">„Weg zur Wasserquelle“</div><p>Die von Gott gegebene <b>Ordnung</b> für das ganze Leben: Gebet, Fasten, Ethik, Familie, Handel und Recht. Sie ist <b>nicht nur Strafrecht</b>. Laut eurem Text sind die Scharias der Propheten in der Form verschieden, im Kern gleich (5:48).</p></div><div class="gl"><div class="glh"><b>Fiqh</b><bdi class="ar">فقه</bdi></div><div class="glm">„Verständnis“</div><p>Die islamische <b>Rechtswissenschaft</b>: wie Gelehrte die Scharia verstehen und auf das Leben anwenden. Sie ist menschlich und kann sich unterscheiden.</p></div><div class="gl"><div class="glh"><b>Madhhab</b><bdi class="ar">مذهب</bdi></div><div class="glm">„Rechtsschule“</div><p>Eine Schule der Rechtsauslegung. Es gibt vier große sunnitische Rechtsschulen: <b>hanafitisch</b> (Gründer Abu Hanifa), malikitisch, schafiitisch und hanbalitisch.</p></div><div class="gl"><div class="glh"><b>Idschtihād</b><bdi class="ar">اجتهاد</bdi></div><div class="glm">„eigene Anstrengung“</div><p>Die selbständige <b>Neuinterpretation</b> von Koran und Sunna durch Gelehrte, je nach Epoche. So kann der Islam auf neue Fragen antworten.</p></div><div class="gl"><div class="glh"><b>Idschmāʿ</b><bdi class="ar">إجماع</bdi></div><div class="glm">„Konsens“</div><p>Die <b>Übereinstimmung</b> der Gelehrten in einer Frage. Neben Koran und Sunna eine wichtige Quelle für religiöse Entscheidungen.</p></div><h3 class="sub">Ausrichtung und innerer Weg</h3><div class="gl"><div class="glh"><b>Widschha</b><bdi class="ar">وجهة</bdi></div><div class="glm">„Gesicht, Ausrichtung“</div><p>Das Gesicht als Bild für die Ausrichtung der <b>ganzen Person</b> auf Gott (Sure 2:148–152). Wie im Deutschen „das Gesicht verlieren“ = Ehre und Ansehen verlieren.</p></div><div class="gl"><div class="glh"><b>Falāḥ</b><bdi class="ar">فلاح</bdi></div><div class="glm">„Erfolg, Heil“</div><p>Der wahre <b>Erfolg bei Gott</b>, wie im Gebetsruf: „Kommt zum Erfolg!“ (ḥayya ʿalā l-falāḥ). Man erreicht ihn, indem man sich innerlich ganz auf Gott ausrichtet.</p></div><div class="gl"><div class="glh"><b>Qibla</b><bdi class="ar">قبلة</bdi></div><div class="glm">„Gebetsrichtung“</div><p>Von <i>qibala</i> = „in Richtung auf“. Erst Jerusalem, dann Mekka (Sure 2:177). Die <b>topografische</b> Seite der Ausrichtung.</p></div><div class="gl"><div class="glh"><b>Tauba</b><bdi class="ar">توبة</bdi></div><div class="glm">„Umkehr, Drehung“</div><p>Wer seinen Kurs verloren hat, richtet sich wieder auf Gott aus (Sure 25:71). Dazu gehören drei Schritte: <b>Reue</b>, <b>feste Absicht</b> und <b>Wiedergutmachung</b>. Mehr als nur „Reue“.</p></div><div class="gl"><div class="glh"><b>Tazkiya</b><bdi class="ar">تزكية</bdi></div><div class="glm">„Läuterung“</div><p>Reinigung und Erleuchtung des Menschen. Gott will, dass der Mensch sich <b>vervollkommnet</b> (Khorchide). Die Läuterung steht vor dem Wissen (Sure 62:2). Ziel ist ein <b>gesundes Herz</b>.</p></div><div class="gl"><div class="glh"><b>Qalb salīm</b><bdi class="ar">قلب سليم</bdi></div><div class="glm">„gesundes, heiles Herz“</div><p>Nur wer mit einem gesunden Herzen zu Gott kommt, ist im Jenseits erfolgreich (Sure 26:88–89). Metapher für die <b>innere Vollkommenheit</b>. <i>salīm</i> hat dieselbe Wurzel wie islām und salām.</p></div><div class="gl"><div class="glh"><b>Salām</b><bdi class="ar">سلام</bdi></div><div class="glm">„Frieden, Heil“</div><p>Frieden mit sich, mit Gott und den Mitmenschen. Gleiche Wurzel <b>s-l-m</b> wie islām. Gruß: <i>as-salāmu ʿalaikum</i> („Friede sei mit euch“). <b>as-Salām</b> ist einer der Namen Gottes, das Paradies heißt „Haus des Friedens“.</p></div><div class="gl"><div class="glh"><b>an-Nafs al-muṭmaʾinna</b><bdi class="ar">النفس المطمئنة</bdi></div><div class="glm">„die Seele voll Ruhe“</div><p>Die Seele, die durch Läuterung Frieden gefunden hat und zu Gott zurückkehrt (Sure 89:27–28). Ziel des inneren Weges.</p></div><div class="gl"><div class="glh"><b>Taqwā</b><bdi class="ar">تقوى</bdi></div><div class="glm">„Gottesbewusstsein“</div><p>Das ständige Bewusstsein, dass Gott alles sieht. Es führt zu Ehrfurcht und verantwortungsvollem Handeln. Oft mit „Gottesfurcht“ übersetzt, meint aber eher Achtsamkeit vor Gott.</p></div><div class="gl"><div class="glh"><b>ʿAmal ṣāliḥ</b><bdi class="ar">عمل صالح</bdi></div><div class="glm">„rechtschaffenes Handeln“</div><p>Gute Taten. Im Koran werden <b>Glaube und rechtschaffenes Handeln</b> fast immer zusammen genannt (z. B. 2:25, 2:277). Der Glaube muss sich im Leben zeigen.</p></div><h3 class="sub">Gemeinschaft und Geschichte</h3><div class="gl"><div class="glh"><b>Umma</b><bdi class="ar">أمة</bdi></div><div class="glm">„Gemeinschaft“</div><p>Die weltweite Gemeinschaft aller Muslime, über Länder, Sprachen und Hautfarben hinweg. Passt zu Kaufmanns <b>Sozialintegration</b>.</p></div><div class="gl"><div class="glh"><b>Hidschra</b><bdi class="ar">هجرة</bdi></div><div class="glm">„Auswanderung“</div><p>Die Auswanderung Muhammads von Mekka nach Medina im Jahr <b>622</b>. Damit beginnt die islamische Zeitrechnung.</p></div><div class="gl"><div class="glh"><b>Kalif</b><bdi class="ar">خليفة</bdi></div><div class="glm">„Nachfolger, Stellvertreter“</div><p>Der Führer der Muslime nach Muhammads Tod (632). Der dritte Kalif war <b>Uthman</b> (644–656), der vierte <b>Ali</b>. In ihrer Zeit kam es zu Streit und Spaltung.</p></div><div class="gl"><div class="glh"><b>Sunniten</b><bdi class="ar">أهل السنة</bdi></div><div class="glm">„Leute der Sunna“</div><p>Die größte Gruppe der Muslime (ca. 85–90 %). Sie erkennen alle vier ersten Kalifen an und folgen der Sunna und dem Konsens.</p></div><div class="gl"><div class="glh"><b>Schiiten</b><bdi class="ar">شيعة</bdi></div><div class="glm">„Partei (Alis)“</div><p>Sie unterstützten <b>Ali</b> bedingungslos und meinen, die Führung der Muslime stehe nur Ali und seinen Nachkommen (den Imamen) zu.</p></div><div class="gl"><div class="glh"><b>Kharidschiten</b><bdi class="ar">خوارج</bdi></div><div class="glm">„die Ausziehenden“</div><p>Sie verließen Ali, weil er einen Schiedsrichter akzeptierte. Für sie wurde ein schwerer Sünder zum Abtrünnigen. Sie neigten zur <b>Intoleranz</b>.</p></div><div class="gl"><div class="glh"><b>Murdschiten</b><bdi class="ar">مرجئة</bdi></div><div class="glm">„die Aufschiebenden“</div><p>Sie „schoben“ das Urteil über Sünder auf und sagten: Das Urteil liegt <b>allein bei Gott</b>, Sünden schaden dem Glauben nicht.</p></div><p class="note">Die Begriffe, die nicht auf deinen Arbeitsblättern stehen, habe ich aus allgemeinem Wissen ergänzt. Vergleiche sie mit deinem Heft.</p>`},

{t:"Islam substanziell und funktional betrachtet",h:`
<p>Die zwei Blickwinkel aus dem christlichen Teil kann man auch auf den Islam anwenden:</p>
<ul><li><b>Substanziell:</b> Was <b>ist</b> der Islam? Was ist sein Inhalt, sein Kern?</li>
<li><b>Funktional:</b> Was <b>leistet</b> der Islam für den Menschen und die Gemeinschaft?</li></ul>
<p>Die arabischen Begriffe in diesem Kapitel stammen aus euren Texten.</p>

<h3 class="sub">Seite 1: Der Islam substanziell (Was ist der Islam?)</h3>
<p>Substanziell schaut man auf das <b>Heilige</b> selbst, hier also auf Gott und die Beziehung zu Ihm.</p>
<div class="box"><h3>Islām <bdi class="ar">إسلام</bdi> = Selbsthingabe an Gott</h3>
<p>Der Kern des Islam ist der Glaube an die <b>Existenz</b> und die <b>Einheit Gottes</b> und die <b>Hingabe</b> an Ihn. Ein <b>Muslim</b> (<bdi class="ar">مسلم</bdi>) ist jemand, der sich Gott ganz hingegeben hat, wie <b>Abraham</b>.</p></div>
<div class="box"><h3>Tauḥīd <bdi class="ar">توحيد</bdi> = die Einheit Gottes</h3>
<p>Gott ist <b>Einer</b>, <b>einzigartig, ewig und transzendent</b>, in deutlicher Abgrenzung zum Polytheismus. Das <b>Bekenntnis zur Einheit</b> heißt <b>Kalima at-Tauḥīd</b>:</p>
<p class="arline"><bdi class="ar">لا إله إلا الله، محمد رسول الله</bdi></p>
<p class="note">lā ilāha illā-llāh, Muḥammadun rasūlu-llāh = Es gibt keine Gottheit außer Gott, und Muhammad ist der Gesandte Gottes.</p></div>
<div class="box"><h3>Āmantu <bdi class="ar">آمنت</bdi> = „ich glaube“</h3>
<p>Das Glaubensbekenntnis nennt den <b>Inhalt</b> des Glaubens: Gott, Engel, Offenbarungsschriften, Propheten, Auferstehung und Jüngstes Gericht, Schicksal (<b>qadar</b>, <bdi class="ar">قدر</bdi>). Der Glaube an den <b>einen Gott</b> ist die Grundlage von allem.</p></div>
<div class="box"><h3>Schahāda <bdi class="ar">شهادة</bdi> = das Glaubenszeugnis</h3>
<p class="arline"><bdi class="ar">أشهد أن لا إله إلا الله وأشهد أن محمدا عبده ورسوله</bdi></p>
<p class="note">aschhadu an lā ilāha illā-llāh wa-aschhadu anna Muḥammadan ʿabduhu wa-rasūluhu = Ich bezeuge, dass es keine Gottheit außer Gott gibt, und ich bezeuge, dass Muhammad Sein Diener und Gesandter ist.</p>
<p>Wer das sagt, bestätigt die <b>Existenz, Erhabenheit und Einheit Gottes</b>.</p></div>
<div class="img"><b>Substanziell gesagt:</b> Der Islam ist die <b>Hingabe an den einen, transzendenten Gott</b>. Das ist sein „Stoff“, sein Inhalt, und das gilt auch dann, wenn der Islam dem Menschen gerade nichts „bringt“.</div>

<h3 class="sub">Seite 2: Der Islam funktional (Was leistet der Islam?)</h3>
<p>Funktional schaut man darauf, was der Islam für den Menschen <b>tut</b>. Dafür nehmen wir die sechs Funktionen von <b>Kaufmann</b>.</p>
<div class="box"><h3>1. Persönlichkeitsstärkung: „Ich bin Muslim“</h3>
<p>Wer die <b>Schahāda</b> spricht, wird <b>Muslim</b> (<bdi class="ar">مسلم</bdi>) und weiß, wer er ist. Kinder lernen das Bekenntnis schon früh auswendig. Das gibt <b>Identität</b> und <b>Sicherheit</b>.</p></div>
<div class="box"><h3>2. Rituale, Moral und Orientierung: Qibla und Widschha</h3>
<p>Die <b>Qibla</b> (<bdi class="ar">قبلة</bdi>, von qibala = „in Richtung auf“) ist die Gebetsrichtung, erst Jerusalem, dann Mekka. Die <b>Widschha</b> (<bdi class="ar">وجهة</bdi>, das „Gesicht“) ist die Ausrichtung der ganzen Person auf Gott.</p>
<p>Dazu kommen die <b>Basispflichten</b>: rituelles Gebet, Fasten, soziale Pflichtabgabe und Wallfahrt. <b>Glaube und rechtschaffenes Handeln</b> gehören zusammen.</p></div>
<div class="box"><h3>3. Kontingenzbewältigung: Qadar</h3>
<p>Der Glaube an das <b>Schicksal</b> (<bdi class="ar">قدر</bdi>, qadar): „Alles, was mir an Gutem oder Bösem widerfährt, kommt von Gott.“ Das hilft, <b>Leid und Unglück</b> zu tragen.</p></div>
<div class="box"><h3>4. Sozialintegration: gemeinsames Bekenntnis und Idschmāʿ</h3>
<p>Das Bekenntnis wird bei der <b>Waschung</b> und bei der <b>Eheschließung</b> auf Arabisch gesprochen. Gelehrte suchen einen <b>Konsens</b> (<bdi class="ar">إجماع</bdi>, idschmāʿ). Islam will eine friedliche Beziehung zu den <b>Mitmenschen</b>.</p></div>
<div class="box"><h3>5. Sinnstiftung: Falāḥ und Gottes Wohlgefallen</h3>
<p>Das Ziel des Lebens ist, <b>Gottes Wohlgefallen</b> zu erlangen (Sure 98:8). Der wahre Erfolg heißt <b>falāḥ</b> (<bdi class="ar">فلاح</bdi>), Erfolg bei Gott, wie im Gebetsruf. Im <b>Jenseits</b> legt man Rechenschaft ab. So hat jede Handlung einen <b>Sinn</b>.</p></div>
<div class="box"><h3>6. Kritik und Veränderung: Tauba und Idschtihād</h3>
<p><b>Tauba</b> (<bdi class="ar">توبة</bdi>, „Drehung“) heißt Umkehr: Reue, Absicht und Wiedergutmachung. Erhabene Werte dürfen <b>nicht für eigennützige Zwecke</b> missbraucht werden. Mit <b>idschtihād</b> (<bdi class="ar">اجتهاد</bdi>) werden Koran und Sunna in jeder Zeit neu gedeutet.</p></div>
<div class="img"><b>Funktional gesagt:</b> Der Islam gibt dem Menschen <b>Identität, Richtung, Trost, Gemeinschaft, Sinn und die Möglichkeit zur Umkehr</b>.</div>

<h3 class="sub">Beide Seiten zusammen</h3>
<p>Im Islam gehören beide Seiten <b>untrennbar zusammen</b>. Das zeigen eure Texte:</p>
<div class="box"><ul>
<li><b>Innere Dimension = eher substanziell:</b> die Hingabe des Herzens an den einen Gott.</li>
<li><b>Äußere Dimension = eher funktional:</b> die gelebte Religion mit Schahāda, Gebet, Fasten, Zakat und Wallfahrt.</li>
<li>Der Text sagt: Islam ist <b>kein im Theoretischen verharrender Glaube</b>. Er spiegelt sich im <b>Leben des Einzelnen und in der Gesellschaft</b> wider.</li>
<li><b>Glaube</b> (substanziell) ohne <b>Handeln</b> (funktional) ist unvollständig, und Handeln ohne Glauben ist leer.</li></ul></div>
<div class="img"><b>Zum Vorstellen:</b> Ein Baum. Die <b>Wurzel</b> ist der Glaube an den einen Gott (substanziell). Die <b>Früchte</b> sind das, was der Glaube im Leben bewirkt (funktional). Ohne Wurzel keine Früchte, und ohne Früchte erkennt man den Baum nicht.</div>

<h3 class="sub">Kritik aus islamischer Sicht</h3>
<div class="box"><p><b>An einer nur funktionalen Sicht:</b> Wer den Islam nur als Hilfe sieht, zum Beispiel nur als Trost in der Not, vergisst den Kern: die <b>Hingabe an Gott um Gottes willen</b>, nicht nur für den eigenen Nutzen.</p>
<p><b>An einer nur substanziellen Sicht:</b> Wer nur „im Kopf“ glaubt, aber nicht danach handelt, lebt den Islam nicht. Im Koran werden <b>Glaube und rechtschaffenes Handeln</b> fast immer zusammen genannt.</p></div>

<div class="tip"><b>Klausur-Satz:</b> „Substanziell betrachtet ist der Islam die Selbsthingabe (islām) an den einen Gott (tauḥīd), wie sie in der Schahāda bezeugt wird. Funktional erfüllt er zum Beispiel die Funktion der Orientierung durch die Qibla und der Kontingenzbewältigung durch den Glauben an das Schicksal (qadar). Im Islam gehören beide Seiten zusammen, denn Glaube und rechtschaffenes Handeln sind untrennbar.“</div>`},
