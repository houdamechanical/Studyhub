{t:"So läuft die Klausur",h:`
<p>Du bekommst <b>ein Material</b>: entweder einen <b>Text</b> oder eine <b>Karikatur</b>. Dazu kommen meist <b>drei Aufgaben</b>, die immer schwieriger werden.</p>
<div class="box"><h3>Aufgabe 1: Herausarbeiten (Inhalt)</h3><p>Was sagt das Material? Du stellst die Position des Autors mit eigenen Worten dar, mit Zeilenangaben. <b>Keine eigene Meinung!</b></p></div>
<div class="box"><h3>Aufgabe 2: Zuordnen und Erläutern (Verbindung)</h3><p>Du verbindest das Material mit dem Unterricht, z. B. mit Kaufmanns Funktionen, mit substanziell/funktional oder mit Tillich. Jede Zuordnung belegst du mit einer Textstelle.</p></div>
<div class="box"><h3>Aufgabe 3: Bewerten (eigenes Urteil)</h3><p>Du sagst begründet, ob die Aussage überzeugt. Du nennst Pro- und Contra-Argumente mit Beispielen und Wissen aus dem Unterricht, auch aus dem Islam. Am Ende steht ein Fazit.</p></div>
<div class="img"><b>Zum Vorstellen:</b> wie beim Arzt. Aufgabe 1 heißt Symptome aufschreiben, Aufgabe 2 heißt Diagnose stellen, Aufgabe 3 heißt eine Empfehlung geben.</div>`},
{t:"Die Operatoren",h:`
<p>Der <b>Operator</b> ist das fett gedruckte Verb in der Aufgabe. Er sagt dir genau, was du tun sollst.</p>
<h3 class="sub">Anforderungsbereich I: wiedergeben</h3>
<ul><li><b>beschreiben:</b> die Merkmale eines Bildes oder Materials mit Worten in Einzelheiten schildern.</li>
<li><b>darstellen / aufzeigen:</b> den Gedankengang oder die Hauptaussage mit eigenen Worten darlegen.</li>
<li><b>nennen / benennen:</b> Elemente, Begriffe, Personen ohne Kommentar angeben.</li>
<li><b>skizzieren:</b> einen Sachverhalt in seinen Grundzügen ausdrücken.</li>
<li><b>wiedergeben / paraphrasieren:</b> den Inhalt mit Fachsprache und eigenen Worten ausdrücken.</li>
<li><b>zusammenfassen:</b> die Kernaussagen komprimiert und strukturiert darlegen.</li></ul>
<h3 class="sub">Anforderungsbereich II: verstehen und verbinden</h3>
<ul><li><b>analysieren / untersuchen:</b> unter einer gezielten Frage Elemente und Zusammenhänge systematisch erschließen.</li>
<li><b>anwenden:</b> einen bekannten Sachverhalt oder eine Methode auf etwas Neues beziehen.</li>
<li><b>einordnen / zuordnen:</b> einen Sachverhalt in einen anderen Zusammenhang stellen oder die Position eines Autors einer Denkrichtung oder Theorie zuordnen, mit Textstellen und Vorwissen.</li>
<li><b>erläutern / erklären / entfalten:</b> einen Sachverhalt mit zusätzlichen Informationen und Beispielen nachvollziehbar machen.</li>
<li><b>herausarbeiten:</b> aus den Aussagen eines Textes eine Position erkennen und darstellen.</li>
<li><b>in Beziehung setzen:</b> Zusammenhänge begründet herstellen.</li>
<li><b>vergleichen / gegenüberstellen:</b> Gemeinsamkeiten, Ähnlichkeiten und Unterschiede ermitteln und darstellen.</li></ul>
<h3 class="sub">Anforderungsbereich III: urteilen</h3>
<ul><li><b>beurteilen / bewerten / Stellung nehmen:</b> sich mit Fachwissen begründet positionieren (Sach- oder Werturteil).</li>
<li><b>eigene Überlegungen entwickeln:</b> einen eigenen bewertenden Gedankengang entfalten.</li>
<li><b>erörtern:</b> ein Problem erkennen, Thesen aufstellen, Pro und Contra abwägen und begründet schließen.</li>
<li><b>gestalten / entwerfen:</b> sich kreativ mit einer Frage auseinandersetzen (z. B. fiktives Gespräch).</li>
<li><b>interpretieren:</b> ein Material sachgemäß analysieren und zu einer schlüssigen Gesamtauslegung kommen.</li>
<li><b>Konsequenzen aufzeigen / Perspektiven entwickeln:</b> Schlussfolgerungen ziehen, Handlungsmöglichkeiten entfalten.</li></ul>
<div class="tip"><b>Satzanfänge</b><br><b>Herausarbeiten:</b> „Der Autor vertritt die These, dass … (Z. x). Er begründet dies damit, dass … Daraus folgert er …“<br><b>Zuordnen:</b> „Diese Aussage lässt sich der Funktion … zuordnen, denn …“<br><b>Bewerten:</b> „Für die Aussage spricht … Dagegen spricht … Insgesamt halte ich die Aussage für teilweise überzeugend, weil …“</div>
<p class="note">Häufigster Fehler: in Aufgabe 1 schon bewerten oder in Aufgabe 3 nur nacherzählen.</p>`},
{t:"Musterlösung: Probeklausur Einstein",h:`
<h3 class="sub">Aufgabe 1: Kernaussagen herausarbeiten</h3>
<div class="box"><p>Im vorliegenden Text beschreibt <b>Albert Einstein</b>, worin für ihn <b>wahre Religiosität</b> besteht.</p>
<ul><li>Das schönste und tiefste Gefühl ist die <b>Erfahrung des Mystischen</b>. Sie ist die Quelle („Säerin“) aller echten Wissenschaft (Z. 1f.).</li>
<li>Wer dieses Gefühl nicht kennt und nicht mehr <b>staunen</b> und in Ehrfurcht stehen kann, ist „so gut wie tot“ (Z. 2–4).</li>
<li>Der <b>Kern wahrer Religiosität</b> ist das Wissen und Spüren, dass das Unergründliche wirklich existiert. Wir können es mit unseren Sinnen nur in seiner primitivsten Form wahrnehmen (Z. 4–7).</li>
<li>Der Mensch ist ein <b>Teil des Ganzen</b>. Dass er sich als getrennt vom Rest erlebt, ist eine „optische Illusion“ seines Bewusstseins (Z. 7–9).</li>
<li>Unsere <b>Aufgabe</b> ist es, uns aus diesem „Gefängnis“ zu befreien, indem wir unser <b>Mitleid auf alle Lebewesen</b> ausdehnen und die ganze Natur in ihrer Schönheit umarmen (Z. 9–11).</li></ul>
<p><b>Fazit:</b> Religion ist für Einstein kein Glaube an einen persönlichen Gott, sondern <b>Staunen</b> über das Universum und <b>Verbundenheit</b> mit allem Leben.</p></div>
<h3 class="sub">Aufgabe 2: Zuordnung zu Kaufmann</h3>
<div class="box"><ul>
<li><b>Sinnstiftung:</b> Ohne das Staunen ist der Mensch „so gut wie tot“ (Z. 4). Erst die Erfahrung des Mystischen gibt dem Leben Sinn und Tiefe.</li>
<li><b>Persönlichkeitsstärkung:</b> Einstein sagt dem Menschen, wer er wirklich ist: „Teil des Ganzen“ (Z. 7), kein isoliertes Ich. Das gibt Identität.</li>
<li><b>Moral / Orientierung:</b> Er gibt eine klare Aufgabe: das Mitleid auf alle lebenden Kreaturen auszudehnen (Z. 10f.). Das ist ein ethischer Maßstab.</li>
<li><b>Sozialintegration (erweitert):</b> Die Verbundenheit gilt nicht nur einer Gruppe, sondern allem Leben und der ganzen Natur.</li>
<li><b>Kritik:</b> Die Befreiung aus dem „Gefängnis“ (Z. 10) kritisiert ein egoistisches, abgetrenntes Leben.</li>
<li><b>Nicht erfüllt:</b> Kontingenzbewältigung (zu Leid und Tod sagt er nichts) und Rituale.</li></ul>
<p class="note">Zusatz: Einsteins Sicht ist eher <b>substanziell</b>, ähnlich wie Schleiermachers „Gefühl für das Unendliche“ und Tillichs Dimension der Tiefe.</p></div>
<h3 class="sub">Aufgabe 3: Bewerten</h3>
<div class="box"><p><b>Für</b> Einsteins Aussage spricht:</p>
<ul><li>Sie ist <b>universal</b>: Auch Menschen ohne Gottesglauben können so religiös sein. Das passt zu <b>Tillich</b>, für den jeder religiös ist, der nach der Tiefe fragt.</li>
<li>Sie verbindet <b>Wissenschaft und Religion</b>, statt sie gegeneinander zu stellen.</li>
<li>Auch der <b>Islam</b> kennt das Staunen: Der Koran fordert oft auf, über die <b>Zeichen (āyāt)</b> in Himmel und Erde nachzudenken. Und der Islam will eine harmonische Beziehung zum <b>gesamten Kosmos</b>.</li>
<li>Aktuelles Beispiel: <b>Umwelt- und Tierschutz</b> folgen direkt aus seiner Ethik des Mitleids.</li></ul>
<p><b>Gegen</b> Einsteins Aussage spricht:</p>
<ul><li>Es fehlt ein <b>persönlicher Gott</b>. Im Islam ist der Kern aber die <b>Hingabe an den einen Gott</b> (Schahāda). Staunen ohne Gott reicht dort nicht.</li>
<li>Im Islam gehören <b>Glaube und Handeln</b> zusammen: Gebet, Fasten, Zakat, Rechenschaft. Bei Einstein fehlen <b>Rituale</b> und <b>Gemeinschaft</b>.</li>
<li>Es fehlt die <b>Kontingenzbewältigung</b>: Einem trauernden Menschen hilft das Staunen über die Sterne wenig. Religionen geben Trost und Hoffnung auf Auferstehung.</li>
<li>Seine Religiosität ist sehr <b>individuell</b> und hat keine festen Inhalte, die man weitergeben könnte.</li></ul>
<p><b>Fazit:</b> Ich halte Einsteins Aussage für <b>teilweise überzeugend</b>. Staunen und Verbundenheit sind ein wichtiger <b>Anfang</b> von Religion, ähnlich wie die Ausrichtung (Widschha) im Islam. Für eine vollständige Religion fehlen aber der Bezug zu Gott, die Gemeinschaft, das Handeln und der Trost im Leid.</p></div>`},

{t:"Klausur 2025 – Christlicher Teil (mit Musterlösung)",h:`
<p class="note">Religionsklausur 11.1 vom 28.10.2025 · Thema: Was ist Religion? · 20 BE</p>
<h3 class="sub">Das Material: die Karikatur</h3>
<div class="box"><h3>„Kirche braucht Begeisterung wie im Fußball“ (Olaf Thielsch)</h3>
<p>Die Karikatur ist auf deinem Klausurblatt. Hier ist sie in Worten beschrieben:</p>
<ul><li><b>Links:</b> eine laute Gruppe <b>Fußballfans des VfL Osnabrück</b>. Sie tragen <b>Trikots, Schals und Fahnen in Lila-Weiß</b>, schwenken eine große karierte Fahne, rufen und singen mit offenem Mund. Einer trägt eine <b>Kiste Bier</b>. Sie wirken begeistert und voller Energie.</li>
<li><b>Rechts:</b> eine <b>katholische Pilgergruppe</b>. Vorne gehen <b>Messdiener</b> in Weiß und ein <b>Priester</b> in Rot, einer trägt ein <b>Kreuz</b>. Sie halten Fahnen mit <b>Alpha und Omega</b> und zwei <b>Kelchen</b> (Christussymbole) und singen aus Liedblättern. Sie wirken ordentlich, aber eher ruhig.</li>
<li><b>In der Mitte:</b> ein gelbes Straßenschild nach <b>Telgte / Münster</b>. Telgte ist ein bekannter Wallfahrtsort. Beide Gruppen kommen sich auf <b>derselben Straße</b> entgegen.</li></ul></div>

<h3 class="sub">Aufgabe 1 (12 BE)</h3>
<div class="box"><p><i>Vergleichen Sie die beiden Gruppen miteinander, indem Sie Ihnen bekannte Religionsbegriffe auf sie übertragen, und erklären Sie dabei, ob Fußball eine Religion oder ein Religionsersatz sein kann.</i></p></div>
<details class="ms"><summary>Musterlösung Aufgabe 1 zeigen</summary><div>
<p><b>Einleitung:</b> Die Karikatur „Kirche braucht Begeisterung wie im Fußball“ von Olaf Thielsch zeigt, wie eine katholische Pilgergruppe auf dem Weg nach Telgte auf eine Gruppe Fußballfans des VfL Osnabrück trifft. Beide Gruppen sind gemeinsam unterwegs, tragen Fahnen und singen. Im Folgenden werden beide Gruppen mit Hilfe von Religionsbegriffen verglichen.</p>
<p><b>1. Gemeinsamkeiten: der funktionale Religionsbegriff</b></p>
<p>Nach dem <b>funktionalen</b> Religionsbegriff ist Religion das, was bestimmte <b>Aufgaben</b> für Menschen erfüllt. Mit den Funktionen nach <b>Kaufmann</b> zeigt sich, dass beide Gruppen sehr ähnlich sind:</p>
<ul><li><b>Sozialintegration:</b> Beide Gruppen sind eine <b>Gemeinschaft</b>. Die Fans tragen dieselben Farben Lila-Weiß, die Pilger gehen zusammen und singen dieselben Lieder.</li>
<li><b>Persönlichkeitsstärkung / Identität:</b> Das Trikot zeigt „Ich bin Osnabrück-Fan“, so wie das Kreuz zeigt „Wir sind Christen“.</li>
<li><b>Rituale:</b> Beide haben feste Abläufe: Die Fans pilgern zum Spiel, schwenken Fahnen und singen Fangesänge. Die Pilger machen eine Wallfahrt mit Kreuz, Fahnen und Liedern. Das passt zu <b>relegere</b> (Cicero): die immer wiederkehrende, sorgfältige Wiederholung.</li>
<li><b>Kontingenzbewältigung (nur teilweise):</b> Fans tragen Sieg und Niederlage gemeinsam.</li>
<li>Nach <b>Durkheim</b> ist Religion ein System von Glaubensvorstellungen und Praktiken in Bezug auf das „Heilige“. Für Fans ist der Verein fast „heilig“; man spricht sogar vom „Fußballtempel“.</li></ul>
<p>→ <b>Funktional</b> betrachtet könnte man Fußball also fast als Religion bezeichnen.</p>
<p><b>2. Unterschiede: der substanzielle Religionsbegriff</b></p>
<p>Nach dem <b>substanziellen</b> Religionsbegriff gehört zur Religion der Bezug auf etwas <b>Transzendentes</b>, auf das Heilige oder auf Gott. Hier zeigt sich der große Unterschied:</p>
<ul><li>Die Fahnen der Pilger zeigen <b>Alpha und Omega</b>, den ersten und letzten Buchstaben des griechischen Alphabets. Sie bedeuten: Christus ist <b>Anfang und Ende</b> von allem. Die <b>Kelche</b> erinnern an das Abendmahl. Die Pilger beziehen sich also auf etwas <b>Ewiges</b>.</li>
<li>Die Fans beziehen sich auf einen <b>Verein</b>, also auf etwas <b>Endliches</b>. Der Verein kann absteigen und Spiele verlieren, und er hat keine Antwort auf die Fragen nach Tod, Leid und Sinn.</li>
<li><b>Schleiermacher</b> versteht Religion als „Sinn und Geschmack für das Unendliche“. Fußball bleibt im Endlichen.</li>
<li><b>Mensching</b>: Religion ist die Begegnung mit dem Heiligen und das antwortende Handeln. Die Pilger antworten auf Gott, die Fans auf ein Spiel.</li>
<li><b>Tillich</b>: Religion ist das Ergriffensein von dem, was uns <b>unbedingt angeht</b>. Ein Verein kann für Fans sehr wichtig werden, aber er ist nur etwas <b>Vorläufiges</b>. Wenn er zum Wichtigsten im Leben wird, ist das eine falsche Ausrichtung.</li>
<li><b>Sinnstiftung</b> und <b>Kontingenzbewältigung</b> im Leid bietet Fußball kaum: Am Grab hilft kein Fangesang.</li></ul>
<p><b>3. Ergebnis: Religion oder Religionsersatz?</b></p>
<p>Fußball ist <b>keine Religion</b>, weil ihm der Bezug zum Transzendenten fehlt (substanziell). Fußball kann aber ein <b>Religionsersatz</b> sein, weil er wichtige <b>Funktionen</b> von Religion übernimmt: Gemeinschaft, Identität, Rituale und starke Gefühle. Genau deshalb kritisieren Theologen den rein funktionalen Religionsbegriff: Sonst wäre auch ein Fußballverein eine Religion.</p>
<p><b>Die Botschaft des Zeichners:</b> Der Titel sagt „Kirche braucht <b>Begeisterung</b> wie im Fußball“. Die Fans wirken lebendig und laut, die Pilger eher brav. Der Zeichner meint: Die Kirche kann vom Fußball lernen, wie man Menschen <b>begeistert</b> und Gemeinschaft <b>erlebbar</b> macht.</p>
</div></details>

<h3 class="sub">Aufgabe 2 (8 BE)</h3>
<div class="box"><p><i>Die moderne Lebenswelt bietet viele Sinnangebote, die in Konkurrenz zum Glauben stehen und die Funktionen einer Ersatzreligion einnehmen können. Nehmen Sie persönlich Stellung zu einem Beispiel für Ersatzreligion (außer Fußball), das Sie oder jemand aus Ihrem Umfeld selbst erfahren hat, und formulieren Sie einen Ratschlag im Umgang damit.</i></p></div>
<details class="ms"><summary>Musterlösung Aufgabe 2 zeigen</summary><div>
<p class="note">Andere mögliche Beispiele: Social Media / Smartphone, Gaming, Shopping und Markenkleidung, Stars und Influencer, Karriere und Geld.</p>
<p><b>Beispiel: Fitness und der perfekte Körper</b></p>
<p><b>1. Das Beispiel:</b> Ein Freund von mir geht sechsmal pro Woche ins Fitnessstudio. Er plant sein Essen genau, postet Fortschrittsbilder und spricht fast nur über Training. Wenn er einmal ausfallen muss, ist er schlecht gelaunt.</p>
<p><b>2. Warum das eine Ersatzreligion sein kann:</b> Fitness übernimmt viele Funktionen von Religion nach Kaufmann:</p>
<ul><li><b>Persönlichkeitsstärkung:</b> Der Körper wird zur Identität: „Ich bin Sportler.“ Das gibt Selbstbewusstsein.</li>
<li><b>Rituale und Orientierung:</b> Es gibt feste Trainingstage, Essenspläne und Regeln, fast wie Gebote.</li>
<li><b>Sozialintegration:</b> Im Studio und online gibt es eine Gemeinschaft mit eigener Sprache.</li>
<li><b>Sinnstiftung:</b> Das Ziel „der perfekte Körper“ gibt dem Alltag eine Richtung.</li></ul>
<p><b>3. Meine Stellungnahme:</b> Ich finde Sport grundsätzlich <b>gut</b>: Er ist gesund, macht diszipliniert und kann Freundschaften schaffen. Problematisch wird es aber, wenn der Körper zum „<b>unbedingten Anliegen</b>“ im Sinne Tillichs wird. Dann bekommt etwas <b>Endliches</b> den Platz, der eigentlich dem Unbedingten gehört. Fitness gibt außerdem <b>keine Antwort auf Leid und Tod</b>: Bei einer Verletzung oder im Alter bricht dieses Sinnsystem zusammen, weil der Körper nicht ewig stark bleibt. Es fehlt also die <b>Kontingenzbewältigung</b>. Außerdem kann großer Druck entstehen, wenn man seinen Wert nur über das Aussehen misst.</p>
<p><b>4. Mein Ratschlag:</b></p>
<ul><li>Sport als <b>Teil</b> des Lebens sehen, nicht als <b>Mittelpunkt</b>.</li>
<li>Den eigenen Wert nicht nur am Körper messen. Man ist mehr als sein Aussehen.</li>
<li>Sich auch die großen Fragen stellen: Was trägt mich, wenn ich krank werde? Wofür lebe ich? Hier können Glaube, Familie und Freunde Halt geben, die nicht vom Erfolg abhängen.</li>
<li>Bewusst Pausen machen, ohne schlechtes Gewissen.</li></ul>
<p><b>Fazit:</b> Fitness kann eine Ersatzreligion werden, weil sie viele Funktionen von Religion erfüllt. Sie kann aber das Wesentliche von Religion, den Bezug zum Unendlichen und den Halt im Leid, nicht ersetzen.</p>
</div></details>
<div class="tip"><b>Was bringt Punkte?</b> In Aufgabe 1 musst du <b>beide</b> Religionsbegriffe (substanziell <b>und</b> funktional) mit Namen und Beispielen aus der Karikatur verbinden und am Ende klar sagen: <b>Religion oder Religionsersatz?</b> In Aufgabe 2 brauchst du ein <b>echtes, persönliches</b> Beispiel, eine <b>begründete</b> Meinung mit Fachbegriffen und einen <b>konkreten</b> Ratschlag.</div>`},

{t:"Klausur 2025 – Islamischer Teil (mit Musterlösung)",h:`
<p class="note">Klausur Kooperativer RU 11.1 vom 11.11.2025 · Thema: Was ist Religion · 20 BE</p>
<h3 class="sub">Das Material: „Religion ist mehr als Ethik“ (Mouhanad Khorchide)</h3>
<div class="box"><p>Der Text steht auf deinem Klausurblatt. Hier ist sein Inhalt in eigenen Worten:</p>
<ul><li><b>Z. 1–4:</b> Religion muss etwas leisten, was die Vernunft nicht leistet, sonst ist sie ersetzbar. Religion ist <b>mehr als Ethik</b>. Im Koran geht es Gott vor allem darum, <b>mit dem Menschen in Beziehung zu treten</b>. Die <b>spirituelle Dimension</b> steht im Vordergrund.</li>
<li><b>Z. 4–6:</b> Gott möchte, dass der Mensch sich <b>vervollkommnet</b>. Der Koran nennt das <b>Läuterung</b> (<b>tazkiya</b>, <bdi class="ar">تزكية</bdi>), also Reinigung und Erleuchtung.</li>
<li><b>Z. 6–12:</b> Gott hat Propheten geschickt, um den Menschen die Verse vorzutragen, sie zu <b>läutern</b> und sie Schrift und Weisheit zu lehren (Sure 62:2 und 3:164). Die Läuterung steht an <b>erster</b> Stelle, das Wissen (die kognitive Dimension) erst an <b>zweiter</b>.</li>
<li><b>Z. 12–17:</b> Die Vervollkommnung ist <b>kein Selbstzweck</b>. Im Jenseits nützen weder Geld noch Kinder; erfolgreich ist, wer mit einem <b>gesunden Herzen</b> zu Gott kommt (Sure 26:88–89). Das „gesunde Herz“ ist eine Metapher für die <b>innere Vollkommenheit</b>.</li>
<li><b>Z. 17–23:</b> Ziel der Läuterung ist, dass der Mensch in die <b>Gemeinschaft Gottes</b> eintritt. Der Koran spricht von der Rückkehr der „Seele voll Ruhe“ zu ihrem Herrn (Sure 89:27–28). Gott <b>zwingt niemanden</b>, er <b>lädt ein</b>; der Mensch entscheidet sich <b>frei</b>.</li></ul></div>

<h3 class="sub">Aufgabe 1 (11 BE)</h3>
<div class="box"><p><i>Erklären Sie, wie der im Text beschriebene Prozess der Läuterung (Tazkiya) mit den zentralen Begriffen der „Hingabe“ an Gott und des „Friedens – Salam“ zusammenhängt.</i></p></div>
<details class="ms"><summary>Musterlösung Aufgabe 1 zeigen</summary><div>
<p><b>Einleitung:</b> Im Text „Religion ist mehr als Ethik“ erklärt Mouhanad Khorchide, dass es Gott im Koran vor allem um die <b>Beziehung</b> zum Menschen und um dessen <b>Läuterung</b> (tazkiya) geht. Im Folgenden wird erklärt, wie diese Läuterung mit der Hingabe (islām) und dem Frieden (salām) zusammenhängt.</p>
<p><b>1. Was ist Läuterung (tazkiya)?</b></p>
<p>Läuterung bedeutet <b>Reinigung</b> und <b>Erleuchtung</b> des Menschen. Gott möchte, dass der Mensch sich <b>vervollkommnet</b> (Z. 4f.). Darum hat er Propheten geschickt, die die Menschen läutern und sie Schrift und Weisheit lehren (Sure 62:2, Z. 8f.). Die Läuterung des Herzens kommt dabei <b>vor</b> dem Wissen (Z. 11f.). Es geht also nicht in erster Linie um Regeln oder Wissen, sondern um das <b>Innere</b> des Menschen.</p>
<p><b>2. Der Schlüssel: eine gemeinsame Wortwurzel</b></p>
<p>Im Arabischen haben vier zentrale Wörter dieselbe Wurzel <b>s-l-m</b> (<bdi class="ar">س ل م</bdi>):</p>
<ul><li><b>islām</b> (<bdi class="ar">إسلام</bdi>) = Hingabe an Gott</li>
<li><b>muslim</b> (<bdi class="ar">مسلم</bdi>) = einer, der sich Gott hingibt</li>
<li><b>salām</b> (<bdi class="ar">سلام</bdi>) = Frieden, Heil</li>
<li><b>salīm</b> (<bdi class="ar">سليم</bdi>) = gesund, heil, unversehrt. Genau dieses Wort steht in Sure 26:89: das „gesunde Herz“ (<i>qalb salīm</i>, <bdi class="ar">قلب سليم</bdi>).</li></ul>
<p>Die Sprache zeigt also schon: <b>Hingabe, Heil-Sein und Frieden gehören zusammen.</b></p>
<p><b>3. Der Zusammenhang als Weg in drei Schritten</b></p>
<ul><li><b>Anfang: Hingabe (islām).</b> Der Mensch öffnet sich Gott und gibt sich ihm hin. Das geschieht <b>freiwillig</b>, denn Gott zwingt niemanden, er lädt ein (Z. 20–22). Hingabe ist die Antwort des Menschen auf Gottes Einladung zur <b>Beziehung</b> (Z. 3f.).</li>
<li><b>Weg: Läuterung (tazkiya).</b> Wer sich Gott hingibt, lässt sich von Ihm „reinigen“. Sein Herz wird Schritt für Schritt von Egoismus, Gier und falschen Bindungen befreit. Geld und Kinder zählen am Ende nicht (Z. 14), sondern nur der Zustand des Herzens.</li>
<li><b>Ziel: Frieden (salām).</b> Das geläuterte Herz wird <b>salīm</b>, also gesund und heil (Z. 15). Ein heiles Herz ist ein Herz <b>im Frieden</b>: mit sich selbst, mit Gott und mit den Mitmenschen. Der Koran nennt diesen Menschen eine „<b>Seele voll Ruhe</b>“ (Sure 89:27, Z. 19f.). Diese Seele kehrt zu Gott zurück und tritt in die <b>Gemeinschaft Gottes</b> ein (Z. 20f.). Das Paradies heißt im Koran auch „<b>Haus des Friedens</b>“ (<i>dār as-salām</i>, Sure 10:25), und <b>as-Salām</b> ist einer der Namen Gottes (Sure 59:23).</li></ul>
<div class="img"><b>Zum Vorstellen:</b> Ein verschmutztes Glas Wasser. <b>Hingabe</b> heißt, das Glas zur Quelle zu bringen. <b>Läuterung</b> ist das Reinigen. <b>Frieden</b> ist das klare, ruhige Wasser am Ende.</div>
<p><b>4. Fazit:</b> Läuterung ist der <b>Weg</b> zwischen Hingabe und Frieden. Die <b>Hingabe</b> (islām) ist der Anfang, die <b>Läuterung</b> (tazkiya) der Prozess und der <b>Frieden</b> (salām) mit einem heilen Herzen (qalb salīm) das Ziel. So zeigt der Text, dass Religion <b>mehr als Ethik</b> ist: Es geht nicht nur um richtiges Handeln, sondern um eine verwandelte, friedvolle Beziehung zu Gott.</p>
</div></details>

<h3 class="sub">Aufgabe 2 (9 BE)</h3>
<div class="box"><p><i>Erörtern Sie die These: „Religion muss etwas leisten, das die Vernunft nicht leistet, ansonsten wird sie ersetzbar.“ Arbeiten Sie die Vielschichtigkeit dieser These heraus, indem Sie die Funktion von Religion sowie von Weltanschauungen bzw. Ideologien miteinander vergleichen und erklären, warum Glaube und religiöse Überzeugungen tief im menschlichen Leben verwurzelt sind.</i></p></div>
<details class="ms"><summary>Musterlösung Aufgabe 2 zeigen</summary><div>
<p><b>1. Die These erklären</b></p>
<p>Khorchide meint: Wenn Religion nur <b>Ethik</b> wäre, also nur Regeln für gutes Handeln, dann bräuchte man sie nicht. Denn gute Regeln kann der Mensch auch mit seiner <b>Vernunft</b> finden, zum Beispiel durch Philosophie, Menschenrechte oder Gesetze. Religion wäre dann <b>ersetzbar</b>. Religion muss also etwas Eigenes bieten.</p>
<p><b>2. Vergleich: Religion und Weltanschauungen / Ideologien</b></p>
<p>Weltanschauungen und Ideologien sind Gesamtdeutungen der Welt <b>ohne Gott</b>, zum Beispiel der <b>Humanismus</b>, der <b>Kommunismus</b>, der <b>Nationalismus</b> oder der Glaube an <b>Konsum</b> und <b>Wissenschaft</b>. Sie können viele Funktionen von Religion nach <b>Kaufmann</b> erfüllen:</p>
<ul><li><b>Moral und Orientierung:</b> Der Humanismus hat klare Werte (Würde, Freiheit).</li>
<li><b>Sozialintegration:</b> Der Nationalismus schafft ein starkes „Wir“.</li>
<li><b>Sinnstiftung:</b> Der Kommunismus versprach eine gerechte Zukunft (klassenlose Gesellschaft).</li>
<li><b>Rituale:</b> Ideologien haben eigene Feiern, Fahnen, Lieder und Aufmärsche.</li></ul>
<p>→ In diesen Bereichen ist Religion tatsächlich <b>ersetzbar</b>. Das spricht <b>für</b> die These: Religion muss mehr bieten.</p>
<p><b>3. Was nur Religion leisten kann</b></p>
<ul><li><b>Beziehung zu Gott:</b> Khorchide sagt, Gott will mit dem Menschen in <b>Beziehung</b> treten (Z. 3f.). Eine Ideologie kann keine Beziehung zu einem persönlichen Gott anbieten.</li>
<li><b>Kontingenzbewältigung:</b> Die Vernunft kann erklären, <b>wie</b> ein Mensch stirbt, aber nicht, <b>warum</b> und was danach kommt. Religion gibt Hoffnung über den Tod hinaus (Jenseits, Rückkehr zu Gott, Sure 89:27f.).</li>
<li><b>Innere Verwandlung:</b> Religion will das Herz <b>läutern</b> (tazkiya), nicht nur das Verhalten regeln.</li>
<li><b>Das Unbedingte:</b> Nach <b>Tillich</b> ist Religion das Ergriffensein von dem, was uns <b>unbedingt</b> angeht. Ideologien machen oft etwas <b>Endliches</b> (Nation, Partei, Geld) zum Absoluten. Das ist gefährlich, wie die totalitären Ideologien des 20. Jahrhunderts zeigen.</li></ul>
<p><b>4. Die Vielschichtigkeit: Kritik an der These</b></p>
<ul><li>Das Wort „<b>leisten</b>“ ist sehr <b>funktional</b>. Es klingt, als wäre Religion ein Produkt, das sich lohnen muss. <b>Substanziell</b> betrachtet ist Religion aber Hingabe an Gott <b>um Gottes willen</b>, nicht wegen ihres Nutzens.</li>
<li><b>Vernunft und Glaube</b> sind keine Gegner. Auch im Islam gehört Wissen dazu: Die Propheten lehren „Schrift und Weisheit“ (Z. 9). Der Koran ruft oft zum Nachdenken auf. Religion steht also nicht <b>gegen</b> die Vernunft, sondern geht <b>über</b> sie hinaus.</li>
<li>Religion lässt sich in der Praxis gar nicht so leicht ersetzen. Trotz Aufklärung und Wissenschaft gibt es Religion bis heute.</li></ul>
<p><b>5. Warum Glaube tief im Menschen verwurzelt ist</b></p>
<ul><li><b>Geschichte:</b> Laut <b>Härle</b> gibt es religiöse Rituale seit ca. <b>50 000 Jahren</b>. Schon frühe Menschen gaben ihren Toten Grabbeigaben mit. Religion ist <b>typisch menschlich</b>.</li>
<li><b>Die großen Fragen:</b> Woher komme ich, wohin gehe ich? Diese Fragen nach der „<b>Dimension der Tiefe</b>“ (Tillich) bleiben, auch wenn die Wissenschaft viel erklärt.</li>
<li><b>Endlichkeit:</b> Der Mensch weiß, dass er sterben wird. Er sucht nach Halt (Schleiermacher: das „Gefühl schlechthinniger Abhängigkeit“).</li>
<li><b>Sehnsucht nach Frieden:</b> Der Mensch sucht innere Ruhe. Der Koran spricht von der „Seele voll Ruhe“, und diese Sehnsucht kann keine Ideologie ganz stillen.</li>
<li><b>Staunen:</b> Wie Einstein sagt, erlebt der Mensch das Geheimnisvolle und staunt darüber.</li></ul>
<p><b>6. Fazit:</b> Ich halte die These für <b>überzeugend</b>, aber mit einer Einschränkung. Es stimmt: Wenn Religion nur Ethik wäre, könnten Vernunft und Weltanschauungen sie ersetzen. Ihre eigentliche „Leistung“ ist aber die <b>Beziehung zu Gott</b>, die <b>Läuterung des Herzens</b> und die <b>Hoffnung über den Tod hinaus</b>. Das kann keine Ideologie bieten. Man sollte Religion jedoch nicht nur nach ihrem Nutzen beurteilen, denn im Kern ist sie <b>Hingabe</b> und nicht Dienstleistung.</p>
</div></details>
<div class="tip"><b>Was bringt Punkte?</b> In Aufgabe 1 die Wurzel <b>s-l-m</b> erklären (islām, salām, salīm, muslim) und den Weg <b>Hingabe → Läuterung → Frieden</b> mit <b>Zeilen und Suren</b> belegen. In Aufgabe 2 nicht nur zustimmen: <b>Pro</b> (Ideologien können Funktionen ersetzen), <b>Contra</b> („leisten“ ist zu funktional, Vernunft und Glaube gehören zusammen), dann klar erklären, <b>warum</b> Glaube tief verwurzelt ist, und ein <b>Fazit</b> ziehen.</div>`}

const S=`stroke="${INK}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"`;
function person(x,y,c,o={}){ // y = Füße
  const sk=o.skin||SKIN,arms=o.arms||"down";
  let a;
  if(arms==="up")a=`<path d="M${x-12},${y-56} L${x-24},${y-88}" ${S} fill="none"/><path d="M${x+12},${y-56} L${x+24},${y-88}" ${S} fill="none"/>`;
  else if(arms==="phone")a=`<path d="M${x-12},${y-54} L${x-18},${y-34}" ${S} fill="none"/><path d="M${x+12},${y-54} L${x+20},${y-44} L${x+8},${y-50}" ${S} fill="none"/><rect x="${x+4}" y="${y-62}" width="11" height="17" rx="2" fill="#333" ${S} stroke-width="2"/><rect x="${x+6}" y="${y-60}" width="7" height="12" fill="#8fe3ff"/>`;
  else if(arms==="point")a=`<path d="M${x-12},${y-54} L${x-18},${y-34}" ${S} fill="none"/><path d="M${x+12},${y-56} L${x+34},${y-66}" ${S} fill="none"/>`;
  else if(arms==="open")a=`<path d="M${x-12},${y-54} L${x-28},${y-46}" ${S} fill="none"/><path d="M${x+12},${y-54} L${x+28},${y-46}" ${S} fill="none"/>`;
  else a=`<path d="M${x-12},${y-54} L${x-18},${y-32}" ${S} fill="none"/><path d="M${x+12},${y-54} L${x+18},${y-32}" ${S} fill="none"/>`;
  const face=o.face==="shock"?`<circle cx="${x-4}" cy="${y-76}" r="2" fill="${INK}"/><circle cx="${x+4}" cy="${y-76}" r="2" fill="${INK}"/><ellipse cx="${x}" cy="${y-68}" rx="3" ry="4" fill="${INK}"/>`
    :o.face==="cool"?`<rect x="${x-10}" y="${y-80}" width="20" height="6" rx="3" fill="${INK}"/><path d="M${x-4},${y-68} Q${x},${y-65} ${x+5},${y-68}" ${S} stroke-width="2" fill="none"/>`
    :o.face==="think"?`<circle cx="${x-4}" cy="${y-76}" r="2" fill="${INK}"/><circle cx="${x+4}" cy="${y-76}" r="2" fill="${INK}"/><path d="M${x-4},${y-68} L${x+4},${y-69}" ${S} stroke-width="2"/>`
    :`<circle cx="${x-4}" cy="${y-76}" r="2" fill="${INK}"/><circle cx="${x+4}" cy="${y-76}" r="2" fill="${INK}"/><path d="M${x-4},${y-69} Q${x},${y-66} ${x+4},${y-69}" ${S} stroke-width="2" fill="none"/>`;
  return `<g><path d="M${x-6},${y-28} L${x-9},${y}" ${S}/><path d="M${x+6},${y-28} L${x+9},${y}" ${S}/>
  <rect x="${x-14}" y="${y-62}" width="28" height="38" rx="11" fill="${c}" ${S}/>${a}
  <circle cx="${x}" cy="${y-75}" r="13" fill="${sk}" ${S}/>${o.hair?`<path d="M${x-13},${y-77} Q${x},${y-98} ${x+13},${y-77} Q${x},${y-86} ${x-13},${y-77}Z" fill="${o.hair}" ${S} stroke-width="2"/>`:""}${face}</g>`;
}
function bowing(x,y,c,sk){ // Niederwerfung, Blick nach rechts
  return `<g><path d="M${x-26},${y} L${x-4},${y}" ${S}/><path d="M${x-22},${y-16} L${x-26},${y}" ${S}/>
  <ellipse cx="${x-2}" cy="${y-18}" rx="25" ry="12" fill="${c}" ${S} transform="rotate(24 ${x-2} ${y-18})"/>
  <path d="M${x+12},${y-10} L${x+30},${y}" ${S}/>
  <circle cx="${x+24}" cy="${y-9}" r="10" fill="${sk||SKIN}" ${S}/></g>`;
}
function bubble(x,y,w,h,lines,tx,ty,o={}){
  const fs=o.fs||11.5;
  return `<g><path d="M${x+w*.3},${y+h-2} L${tx},${ty} L${x+w*.5},${y+h-2}" fill="#fff" ${S} stroke-width="2.2"/>
  <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${o.r||14}" fill="#fff" ${S} stroke-width="2.2"/>
  <path d="M${x+w*.3+2},${y+h-1.5} L${x+w*.5-2},${y+h-1.5}" stroke="#fff" stroke-width="4"/>
  ${lines.map((l,n)=>`<text x="${x+w/2}" y="${y+h/2+(n-(lines.length-1)/2)*(fs+3)+fs*.35}" text-anchor="middle" font-family="Caveat,cursive" font-weight="700" font-size="${fs+5}" fill="${INK}">${l}</text>`).join("")}</g>`;
}
function think(x,y,w,h,lines,tx,ty){
  return `<g><circle cx="${tx}" cy="${ty}" r="3" fill="#fff" ${S} stroke-width="2"/><circle cx="${(tx+x+w/2)/2}" cy="${(ty+y+h)/2}" r="5" fill="#fff" ${S} stroke-width="2"/>
  <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${h/2}" fill="#fff" ${S} stroke-width="2.2" stroke-dasharray="1 0"/>
  ${lines.map((l,n)=>`<text x="${x+w/2}" y="${y+h/2+(n-(lines.length-1)/2)*16+5}" text-anchor="middle" font-family="Caveat,cursive" font-weight="700" font-size="17" fill="${INK}">${l}</text>`).join("")}</g>`;
}
const label=(x,y,t,o={})=>`<text x="${x}" y="${y}" text-anchor="${o.a||"middle"}" font-family="${o.f||"Inter,sans-serif"}" font-weight="${o.w||700}" font-size="${o.s||11}" fill="${o.c||INK}">${t}</text>`;
const svg=(inner,h=300)=>`<svg viewBox="0 0 400 ${h}" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;

  if(k==="c")return `<pattern id="${id}" width="44" height="44" patternUnits="userSpaceOnUse"><rect width="44" height="44" fill="#4a3cb8"/><path d="M0,0 L22,22 L44,0 M0,44 L22,22 L44,44" stroke="#2a1f78" stroke-width="3"/><path d="M22,22 m-9,0 a9,9 0 1,0 18,0 a9,9 0 1,0 -18,0" fill="#e8b44a" opacity=".85" stroke="#2a1f78" stroke-width="2"/><path d="M0,22 L8,22 M36,22 L44,22" stroke="#2a1f78" stroke-width="3"/><circle cx="0" cy="22" r="5" fill="#e0573f" opacity=".8"/><circle cx="44" cy="22" r="5" fill="#e0573f" opacity=".8"/><circle cx="22" cy="0" r="5" fill="#3fd1a4" opacity=".7"/><circle cx="22" cy="44" r="5" fill="#3fd1a4" opacity=".7"/></pattern>`;

  return `<pattern id="${id}" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#c9861a"/><path d="M0,24 L24,0" stroke="#f6d58c" stroke-width="3"/></pattern>`;

    :`<g transform="translate(90 132)"><circle r="34" fill="#0c0f24" opacity=".35"/>${[0,1,2,3,4,5,6,7].map(n=>`<ellipse rx="7" ry="15" transform="rotate(${n*45}) translate(0 -14)" fill="${["#e8b44a","#e0573f","#3fd1a4","#8f7cff"][n%4]}" opacity=".9"/>`).join("")}<circle r="7" fill="#f6d58c"/><path d="M0,-5 V5 M-4,-1 H4" stroke="#2a1f78" stroke-width="2"/></g>`;
  return `<svg viewBox="0 0 180 240"><defs>${pattern(k,"pp"+k)}<linearGradient id="dk${k}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".45"/></linearGradient></defs>

/* ===================== APP ===================== */
const ACC={c:"#5b4bd1",i:"#0d8f6c",k:"#d0533d",t:"#b77a14",l:"#3c6fb0"};
const app=document.getElementById("app");
const ORDER=["c","i","k","t","l"];
const NAMES={c:"Christlicher Teil",i:"Islamischer Teil",k:"Karikaturen",t:"Klausur-Training",l:"Karteikarten & Quiz"};

function home(){
  document.body.className="";
  app.innerHTML=`<div class="fade"><div class="hero">
  <svg class="moon" viewBox="0 0 100 100"><circle cx="50" cy="50" r="34" fill="#f6d58c" opacity=".15"/><circle cx="50" cy="50" r="24" fill="#f6d58c"/><circle cx="62" cy="42" r="22" fill="#0c0f24"/><circle cx="20" cy="20" r="2" fill="#fff"/><circle cx="86" cy="76" r="1.5" fill="#fff"/><circle cx="78" cy="18" r="1.2" fill="#fff"/></svg>
  <div class="eyebrow">Religion · Klasse 11b</div><h1>Was ist<br><em>Religion?</em></h1><p>Zwei Tore, ein Ziel: die Klausur. Wähle deinen Weg.</p><button class="fsbtn" data-fs="1">⛶ Vollbild</button></div>
  <div class="portals">
   <button class="portal" data-go="c">${portal("c")}<h2>Christlicher Teil</h2><small>${PAGES.c.chapters.length} Kapitel</small></button>
   <button class="portal" data-go="i">${portal("i")}<h2>Islamischer Teil</h2><small>${PAGES.i.chapters.length} Kapitel</small></button>
  </div>
  <button class="wide k" data-go="k"><svg class="art" viewBox="0 0 80 70"><rect x="4" y="6" width="64" height="54" rx="4" fill="#fff" stroke="${INK}" stroke-width="3" transform="rotate(-5 36 33)"/><circle cx="30" cy="38" r="9" fill="${SKIN}" stroke="${INK}" stroke-width="2.5"/><rect x="38" y="14" width="34" height="18" rx="8" fill="#fff" stroke="${INK}" stroke-width="2.5"/><path d="M44,32 L38,38" stroke="${INK}" stroke-width="2.5"/><text x="55" y="27" text-anchor="middle" font-family="Caveat" font-weight="700" font-size="13">?!</text></svg><div><h2>Karikaturen</h2><p>Methode + 5 Übungs-Karikaturen mit Lösung</p></div><span class="go">→</span></button>
  <button class="wide t" data-go="t"><svg class="art" viewBox="0 0 80 70"><rect x="12" y="8" width="50" height="58" rx="4" fill="#fff" stroke="${INK}" stroke-width="3"/><path d="M20,24 H54 M20,34 H54 M20,44 H42" stroke="#c9861a" stroke-width="3" stroke-linecap="round"/><path d="M50,46 l6,6 l12,-14" stroke="#0d8f6c" stroke-width="4" fill="none" stroke-linecap="round"/></svg><div><h2>Klausur-Training</h2><p>Ablauf · Operatoren · Musterlösung Einstein</p></div><span class="go">→</span></button>
  <button class="wide l" data-go="l"><svg class="art" viewBox="0 0 80 70"><rect x="16" y="14" width="50" height="36" rx="5" fill="#fff1a6" stroke="${INK}" stroke-width="3" transform="rotate(8 41 32)"/><rect x="10" y="18" width="50" height="36" rx="5" fill="#fff" stroke="${INK}" stroke-width="3"/><text x="35" y="42" text-anchor="middle" font-family="Fraunces,serif" font-weight="900" font-size="18" fill="${INK}">?</text></svg><div><h2>Karteikarten & Quiz</h2><p>Begriffe wiederholen und dich testen</p></div><span class="go">→</span></button>
  </div>`;
}

function readPage(key){
  document.body.className="read";
  const acc=ACC[key];
  let chapters=[],intro="",title=NAMES[key];
  if(PAGES[key]){chapters=PAGES[key].chapters;intro=PAGES[key].intro}
  if(key==="k"){intro="Erst lernst du die Methode. Dann übst du an fünf Karikaturen. Überlege immer zuerst selbst und decke dann die Lösung auf.";
    chapters=[{t:"So analysierst du eine Karikatur",h:KMETHOD},...Object.values(CARTOONS).map(c=>({t:"Übung: "+c.t,h:cartoonHTML(c)}))]}
  if(key==="l"){intro="Wiederhole die wichtigsten Begriffe mit den Karteikarten und teste dich dann mit dem Quiz.";
    chapters=[{t:"Karteikarten",h:`<div id="cards"></div>`},{t:"Quiz",h:`<div id="quiz"></div>`}]}
  const idx=ORDER.indexOf(key),next=ORDER[idx+1];
  app.innerHTML=`<div class="rbar"><button class="rback" data-go="home" aria-label="Zur Startseite">←</button><span class="rtitle">${title}</span><button class="fsbtn" data-fs="1">⛶ Vollbild</button><button class="rtop" data-top="1">Inhalt ↑</button></div>
  <article class="doc" style="--accent:${acc}">
   <header class="dochead"><span class="kick">${key==="c"?"✝":key==="i"?"☪":"✎"} ${title}</span><h1>${title}</h1><p>${intro}</p></header>
   <nav class="toc"><b>Inhalt</b><ol>${chapters.map((c,n)=>`<li><button data-ch="${n}">${c.t}</button></li>`).join("")}</ol></nav>
   ${chapters.map((c,n)=>`<section class="ch" id="ch${n}"><span class="chn">Kapitel ${n+1}</span><h2>${c.t}</h2>${c.h}</section>`).join("")}
   <div class="docend">${next?`<button data-go="${next}">Weiter: <b>${NAMES[next]}</b> →</button>`:""}<button class="ghost" data-go="home">← Zur Startseite</button></div>
  </article>`;
  if(key==="l"){cards();quiz()}
}
function cartoonHTML(c){
  return `<div class="cartoon">${c.draw()}</div><div class="caption">${c.cap}</div>
  ${c.steps.map((s,n)=>`<div class="step"><div class="q"><span class="n">${n+1}</span><span><b>${s[0]}</b><small>${s[1]}</small></span></div><button class="reveal" data-reveal="1">Lösung zeigen</button><div class="ans">${s[2]}</div></div>`).join("")}`;
}
function seg(cb){const w=document.createElement("div");w.className="seg";[["a","Alle"],["c","Christlich"],["i","Islamisch"]].forEach(([v,l],n)=>{const b=document.createElement("button");b.textContent=l;if(!n)b.className="on";b.onclick=()=>{w.querySelectorAll("button").forEach(x=>x.classList.remove("on"));b.classList.add("on");cb(v)};w.appendChild(b)});return w}
function cards(){
  const box=document.getElementById("cards");let deck=CARDS.slice(),i=0;
  box.appendChild(seg(v=>{deck=CARDS.filter(c=>v==="a"||c[2]===v);i=0;draw()}));
  const f=document.createElement("div");f.className="flip";f.innerHTML=`<div class="fi"><div class="side front"><b></b><span class="hint">Tippen zum Umdrehen</span></div><div class="side backs"><span></span></div></div>`;box.appendChild(f);
  const r=document.createElement("div");r.className="row";r.innerHTML=`<button class="btn">←</button><span class="note"></span><button class="btn">Mischen</button><button class="btn main">→</button>`;box.appendChild(r);
  const [bp,cnt,bm,bn]=r.children;
  function draw(){f.classList.remove("f");f.querySelector(".front b").textContent=deck[i][0];f.querySelector(".backs span").textContent=deck[i][1];cnt.textContent=(i+1)+" / "+deck.length}
  f.onclick=()=>f.classList.toggle("f");bp.onclick=()=>{i=(i-1+deck.length)%deck.length;draw()};bn.onclick=()=>{i=(i+1)%deck.length;draw()};bm.onclick=()=>{deck.sort(()=>Math.random()-.5);i=0;draw()};draw();
}
function quiz(){
  const box=document.getElementById("quiz");let Q=QUIZ.slice(),i=0,sc=0,done=false;
  box.appendChild(seg(v=>{Q=QUIZ.filter(q=>v==="a"||q[4]===v||q[4]==="t");i=0;sc=0;draw()}));
  const a=document.createElement("div");box.appendChild(a);
  function draw(){done=false;
    if(i>=Q.length){a.innerHTML=`<div class="result"><div class="big">${sc} / ${Q.length}</div><p>${sc===Q.length?"Alles richtig.":sc>=Q.length*.7?"Gut gemacht.":"Lies die Kapitel noch einmal und versuch es erneut."}</p><button class="btn main" id="ag">Nochmal</button></div>`;document.getElementById("ag").onclick=()=>{i=0;sc=0;draw()};return}
    const q=Q[i];a.innerHTML=`<div class="qhead"><span>Frage ${i+1} von ${Q.length}</span><span>${sc} richtig</span></div><div class="qbar"><div style="width:${i/Q.length*100}%"></div></div><p class="qq">${q[0]}</p>`;
    q[1].forEach((o,n)=>{const b=document.createElement("button");b.className="btn opt";b.textContent=o;b.onclick=()=>{if(done)return;done=true;
      if(n===q[2]){b.classList.add("r");sc++}else{b.classList.add("w");a.querySelectorAll(".opt")[q[2]].classList.add("r")}
      const e=document.createElement("p");e.className="note";e.textContent=q[3];a.appendChild(e);
      const nb=document.createElement("button");nb.className="btn main";nb.style.width="100%";nb.style.marginTop="8px";nb.textContent=i+1<Q.length?"Nächste Frage":"Ergebnis zeigen";nb.onclick=()=>{i++;draw()};a.appendChild(nb)};a.appendChild(b)})}
  draw();
}
function go(h){if(ORDER.includes(h))readPage(h);else home();window.scrollTo(0,0);setTimeout(()=>window.scrollTo(0,0),0)}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-go],[data-ch],[data-top],[data-reveal],[data-fs]");if(!t)return;
  if(t.dataset.fs){toggleFs();return}
  if(t.dataset.go){e.preventDefault();go(t.dataset.go)}
  else if(t.dataset.ch){const el=document.getElementById("ch"+t.dataset.ch);if(el){const y=el.getBoundingClientRect().top+window.pageYOffset-60;window.scrollTo(0,y)}}
  else if(t.dataset.top){window.scrollTo(0,0)}
  else if(t.dataset.reveal){t.parentNode.classList.add("open")}
});
function fsEl(){return document.fullscreenElement||document.webkitFullscreenElement}
function toggleFs(){
  const d=document.documentElement;
  try{
    if(fsEl()){(document.exitFullscreen||document.webkitExitFullscreen).call(document);return}
    const r=(d.requestFullscreen||d.webkitRequestFullscreen);
    if(!r){fsHint();return}
    const p=r.call(d);if(p&&p.catch)p.catch(fsHint);
  }catch(e){fsHint()}
}
function fsHint(){let n=document.getElementById("fshint");if(!n){n=document.createElement("div");n.id="fshint";document.body.appendChild(n)}
  n.textContent="Vollbild wird hier vom Gerät nicht erlaubt. Drehe das iPad ins Querformat, die Seite passt sich der Breite an.";n.className="show";setTimeout(()=>n.className="",5000)}
go("home");

</script>
